name: Bot Marathon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # There is deliberately NO plain `cargo test` job here. Basic Checks' `test`
  # matrix already runs `cargo test --all` on beta, stable, AND the pin from
  # rust-toolchain.toml, all under RUSTFLAGS=-Dwarnings — a strict superset of what a
  # stable-only, warnings-permitted run proves, so the job that used to live
  # here could never fail while that matrix passed. It was one full compile of
  # the crate on every PR for no additional signal.
  #
  # Every job below earns its place by covering something that matrix does not:
  # a non-default feature, an #[ignore]d suite, or the packaged-crate build.
  pokerbench:
    name: PokerBench feature (EPIC-43)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `full` includes `pokerbench` since 0.16.0, so the other jobs compile it
      # too. This job still runs the whole suite and lints on stable.
      # clippy comes from rust-toolchain.toml's components on the pinned toolchain.
      - run: cargo test --features full
      - run: cargo clippy --features full -- -D warnings

  optional-features:
    name: Optional features (debug-json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # debug-json is in no umbrella feature, so nothing else on CI builds it
      # (audit VI.4 / P7). bot-training is in `full` since 0.16.0, so the main
      # test and clippy jobs cover it.
      - run: cargo test --features full,debug-json

  marathon:
    name: Bot Marathon (1 000 hands)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run bot marathon
        env:
          MARATHON_DUMP_PATH: marathon_failure.yaml
        run: cargo test --features full --test bot_marathon -- --include-ignored --nocapture
      - name: Upload failure YAML
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marathon-failure-${{ github.run_id }}
          path: marathon_failure.yaml
          if-no-files-found: ignore

  variant-replays:
    name: Variant replays (FLHE/PLO/Stud/Razz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The marathon job above is NLHE-only. These round-trips drive a full
      # bot-selfplay hand of each non-hold'em variant through the engine and
      # replay it — the only CI coverage that exercises the II.1–II.6 betting
      # rules (PLO pot cap, stud completion, Razz ace-low bring-in, antes as
      # dead money) end to end. They are `#[ignore]`d for local speed, so run
      # them explicitly here.
      - name: Run variant replay round-trips
        run: cargo test --features full --test replay_consistency -- --include-ignored --nocapture

  okf:
    name: OKF bundle conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # Deterministic checker (no LLM): keeps the .okf/ knowledge bundle
      # conformant with the OKF v0.1 spec (frontmatter parseable, non-empty
      # `type`, strict: warnings fail too).
      - run: make validate-okf

  package:
    name: Package smoke (published-crate build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Publish-honesty gate (audit P1): verify-build the crate exactly as it
      # ships from the packaged tarball — the ~403 MB generated/bcm.zst is absent
      # here, so this proves the BCM-backed APIs degrade to Err(BcmUnavailable)
      # rather than failing the build, and that no excluded internal files are
      # required to compile.
      - name: cargo package (verify build of packaged crate)
        run: cargo package
