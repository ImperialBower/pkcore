name: Bot Marathon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  pokerbench:
    name: PokerBench feature (EPIC-43)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The pokerbench module is gated off by default, so the plain `test` job
      # never compiles it. Exercise it explicitly here (tests, doc tests, lints).
      # clippy comes from rust-toolchain.toml's components on the pinned toolchain.
      - run: cargo test --features pokerbench
      - run: cargo clippy --features pokerbench -- -D warnings

  optional-features:
    name: Optional features (bot-training, debug-json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # bot-training and debug-json compile today but nothing on CI built them,
      # so they could silently rot (audit VI.4 / P7). Exercise both explicitly.
      # The heavy `training_integration` run stays #[ignore]d (release-only), so
      # this only compiles the feature + runs the fast unit/doc tests.
      - run: cargo test --features bot-training
      - run: cargo test --features debug-json

  marathon:
    name: Bot Marathon (1 000 hands)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run bot marathon
        env:
          MARATHON_DUMP_PATH: marathon_failure.yaml
        run: cargo test --test bot_marathon -- --include-ignored --nocapture
      - name: Upload failure YAML
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-failure-${{ github.run_id }}
          path: marathon_failure.yaml
          if-no-files-found: ignore

  variant-replays:
    name: Variant replays (FLHE/PLO/Stud/Razz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The marathon job above is NLHE-only. These round-trips drive a full
      # bot-selfplay hand of each non-hold'em variant through the engine and
      # replay it — the only CI coverage that exercises the II.1–II.6 betting
      # rules (PLO pot cap, stud completion, Razz ace-low bring-in, antes as
      # dead money) end to end. They are `#[ignore]`d for local speed, so run
      # them explicitly here.
      - name: Run variant replay round-trips
        run: cargo test --test replay_consistency -- --include-ignored --nocapture

  okf:
    name: OKF bundle conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      # Deterministic checker (no LLM): keeps the .okf/ knowledge bundle
      # conformant with the OKF v0.1 spec (frontmatter parseable, non-empty
      # `type`, strict: warnings fail too).
      - run: make validate-okf

  package:
    name: Package smoke (published-crate build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Publish-honesty gate (audit P1): verify-build the crate exactly as it
      # ships from the packaged tarball — the ~403 MB generated/bcm.zst is absent
      # here, so this proves the BCM-backed APIs degrade to Err(BcmUnavailable)
      # rather than failing the build, and that no excluded internal files are
      # required to compile.
      - name: cargo package (verify build of packaged crate)
        run: cargo package
