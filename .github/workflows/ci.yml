name: Bot Marathon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  marathon:
    name: Bot Marathon (1 000 hands)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run bot marathon
        env:
          MARATHON_DUMP_PATH: marathon_failure.yaml
        run: cargo test --test bot_marathon -- --include-ignored --nocapture
      - name: Upload failure YAML
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-failure-${{ github.run_id }}
          path: marathon_failure.yaml
          if-no-files-found: ignore
