name: Security audit
on:
  # A new advisory can land against a dependency nobody touched, so the cron is
  # the only trigger that catches those. The push/PR triggers cut the dwell time
  # for advisories introduced by a dependency change.
  schedule: # Every Sunday at 1 AM
    - cron: '0 1 * * 0'
  # Post-merge safety net. Restricted to `main` so a branch with an open PR is
  # not scanned twice (the pull_request trigger already covers it).
  push:
    branches: [main]
  # Unfiltered on purpose: Dependabot and fork PRs push to a fork, where the
  # `push` trigger never fires in this repo, so without this a bumped dependency
  # would reach `main` unscanned. Also makes the scan a per-PR status check
  # rather than a detached commit status that is easy to miss.
  pull_request:

jobs:
  security_audit:
    name: SecurityAudit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - name: Scan for vulnerabilities
        run: cargo deny check advisories

