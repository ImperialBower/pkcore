name: Basic Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Rust ${{matrix.rust}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [beta, stable, 1.94.1]
#        include:
#          - rust: nightly
#            rustflags: --cfg thiserror_nightly_testing
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{matrix.rust}}
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
        env:
          RUSTFLAGS: ${{matrix.rustflags}} ${{env.RUSTFLAGS}}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
#      - name: Check semver
#        uses: obi1kenobi/cargo-semver-checks-action@v2
      - name: Read toolchain from rust-toolchain.toml
        id: toolchain
        run: |
          version=$(grep '^channel' rust-toolchain.toml | tr -d ' "' | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -Dclippy::all -Dclippy::pedantic

  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Read toolchain from rust-toolchain.toml
        id: toolchain
        run: |
          version=$(grep '^channel' rust-toolchain.toml | tr -d ' "' | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, rust-src
      - run: cargo fmt --all -- --check

  doc:
    name: Doc
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  no-default-features:
    name: No-default-features
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Read toolchain from rust-toolchain.toml
        id: toolchain
        run: |
          version=$(grep '^channel' rust-toolchain.toml | tr -d ' "' | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features --lib --tests
      - run: cargo check --no-default-features --features hand-histories --lib --tests
      - run: cargo check --no-default-features --features bot-profiles --lib --tests
      - run: cargo check --no-default-features --features player-stats --lib --tests
      - run: cargo check --no-default-features --features player-stats-persistence --lib --tests
      # Equity in isolation: the `pkodds` service builds pkcore with just this
      # feature. Guards against the equity engine bit-rotting or coupling to the
      # default stack (it silently broke once because nothing on CI built it).
      - run: cargo check --no-default-features --features equity --lib --tests
      # Kernel purity gate (AUDIT_Fable_5.md III.1 / III.6.1): with default
      # features off, the storage (`store`) and terminal (`terminal`) layers must
      # drop out entirely — no rusqlite/zstd/termion/dotenvy in the dependency
      # tree. This is the mechanism that keeps purity reachable; without it, a new
      # non-optional dependency would silently re-cap the kernel.
      # NOTE: `serde_yaml_bw` is a *documented exception* — it arrives
      # transitively through `pkstate`, so pkcore cannot drop it until pkstate
      # makes its YAML optional upstream. Remove it from the allowlist once that
      # lands.
      - name: Kernel purity gate (no-default-features)
        run: |
          tree=$(cargo tree --no-default-features -e no-dev)
          leaked=$(echo "$tree" | grep -iE 'rusqlite|zstd|termion|dotenvy' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Purity gate failed — these deps must be feature-gated behind store/terminal:"
            echo "$leaked"
            exit 1
          fi
          echo "Purity gate passed: no rusqlite/zstd/termion/dotenvy with --no-default-features."
          echo "(serde_yaml_bw remains via pkstate — documented ceiling, see AUDIT_Fable_5.md III.1.)"
