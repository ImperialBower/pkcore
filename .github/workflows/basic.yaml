name: Basic Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Rust ${{matrix.rust}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 'pinned' resolves to rust-toolchain.toml's channel inside the
        # composite action, so bumping the pin moves this matrix with it — the
        # literal version that used to live here had no drift guard, and this
        # matrix is the ONLY job running `cargo test` on the pinned toolchain.
        rust: [beta, stable, pinned]
# If re-enabled, restore the per-step env override on the `cargo test` step:
#   env:
#     RUSTFLAGS: ${{matrix.rustflags}} ${{env.RUSTFLAGS}}
#        include:
#          - rust: nightly
#            rustflags: --cfg thiserror_nightly_testing
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{matrix.rust}}
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `full` is the 0.14.0 default set; the lean builds are covered by
      # the no-default-features job and `make check-purity`.
      - run: cargo test --all --features full

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --features full -- -Dclippy::all -Dclippy::pedantic

  # Semver posture (AUDIT_Fable_5.md P6): compares the crate's public API against
  # the last version published to crates.io and fails if the change is breaking
  # without a matching version bump. This is the mechanism that keeps the
  # `#[non_exhaustive]` / error-type contract honest — a breaking change now
  # forces a deliberate 0.x minor bump instead of slipping out in a patch.
  semver:
    name: Semver
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt, rust-src
      - run: cargo fmt --all -- --check

  doc:
    name: Doc
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps --features full
        env:
          RUSTDOCFLAGS: -Dwarnings

  no-default-features:
    name: No-default-features
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Full test run with default features off: compiles lib, tests, AND
      # examples (which `--lib --tests` skips) and runs the non-gated suite.
      # Building examples is what surfaces one that uses a feature-gated API
      # without a `required-features` entry (audit II.11 / P7) — the reason a
      # plain `cargo check --lib --tests` never caught it. The suite needs
      # `entropy` (0.15.0); `kernel_determinism` runs with nothing at all.
      # Single source for both, and for the per-feature checks: the Makefile.
      - run: make test-kernel
      # Every feature alone — lib without `entropy`, lib and tests with it.
      # Equity in isolation matters in particular: the `pkodds` service builds
      # pkcore with just that feature.
      - run: make check-features
      # Kernel purity gate (AUDIT_Fable_5.md III.1 / III.6.1): with default
      # features off, the storage (`store`) and terminal (`terminal`) layers must
      # drop out entirely — no rusqlite/zstd/termion/dotenvy in the dependency
      # tree. This is the mechanism that keeps purity reachable; without it, a new
      # non-optional dependency would silently re-cap the kernel.
      # NOTE: `serde_yaml_bw` is a *documented exception* — it arrives
      # transitively through `pkstate`, so pkcore cannot drop it until pkstate
      # makes its YAML optional upstream. Remove it from the allowlist once that
      # lands.
      # Single source: the gate lives in the Makefile (`check-purity`) so CI and
      # local runs cannot drift (audit P9j.4). The `::error::` annotation is
      # emitted by the Makefile target itself.
      - name: Kernel purity gate (no-default-features)
        run: make check-purity

  # Coverage is a REPORT, not a gate: no `--fail-under-*` threshold is passed, so
  # this job never goes red over a coverage dip. It uses cargo-llvm-cov — the same
  # engine as `make coverage` — so the number in CI is the number you reproduce
  # locally. (cargo-tarpaulin was considered and rejected: its default ptrace
  # engine is Linux-only, so it could not run on a maintainer's macOS box, and a
  # second tool would report a second, permanently-disagreeing number.)
  #
  # CAVEAT: doc tests are NOT counted. `cargo llvm-cov --doctests` needs nightly,
  # and this job runs on the pinned stable toolchain. Since CLAUDE.md mandates a
  # doc test per public function, the reported figure UNDERSTATES real coverage —
  # read it as a floor, and don't chase it with redundant unit tests.
  coverage:
    name: Coverage (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      # `--all-features` is safe on a bare checkout even though two artifacts are
      # absent here: `generated/bcm.zst` is gitignored (~403 MB) and its APIs
      # degrade to `Err(BcmUnavailable)`, and the `generators` feature's
      # `UNIQUE_HANDS` reads its ungenerated file through `unwrap_or_default()`
      # and yields an empty set. Neither panics, so neither fails the run.
      #
      # Instrument and run the suite ONCE — `--no-report` retains the raw profile
      # data — then render both formats from that same data below. Invoking
      # `--lcov` and `--html` separately would re-run the whole suite twice.
      - name: Run instrumented test suite
        run: cargo llvm-cov --all-features --no-report
      - name: Render lcov + HTML reports
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html
      # Surfaces the per-file table on the run's Summary tab, so the number is
      # readable without downloading and unzipping the artifact.
      - name: Publish summary
        run: |
          {
            echo '### Coverage (doc tests excluded — see workflow comment)'
            echo ''
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}
          path: |
            lcov.info
            target/llvm-cov/html
          if-no-files-found: error

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Two production WASM apps (pkgto-web, pkkuhn-web) depend on pkcore
      # building for wasm32; nothing else in CI checked it (audit VI.4). The
      # store/terminal deps are target-gated off on wasm, so `--lib` is the
      # meaningful surface. Runs under the global RUSTFLAGS=-Dwarnings.
      - run: cargo check --target wasm32-unknown-unknown --lib
