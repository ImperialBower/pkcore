name: OpenSSF Scorecard

# Publishes the OpenSSF Scorecard result to api.securityscorecards.dev, which is
# what serves the README badge, and uploads the SARIF to the Security tab.
# `publish_results: true` imposes rules on this file: no top-level write
# permissions, no top-level env/defaults, and only the approved actions below.
on:
  # Re-score when branch protection changes — the Branch-Protection check
  # reads those rules, and nothing else would trigger a run.
  branch_protection_rule:
  schedule: # Every Tuesday at 3 AM
    - cron: '0 3 * * 2'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # OIDC token that authenticates the publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
