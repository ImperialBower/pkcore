[package]
name = "pkcore-perf"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Cross-target performance harness for the pkcore domain kernel. Not published."

# LOAD-BEARING: declares this crate its own workspace root so Cargo does not
# walk up to pkcore's manifest and adopt it. See design Section 1.
[workspace]

[dependencies]
pkcore = { path = "..", default-features = false }
itertools = "0.14"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The example benches under benches/ exist for edification: the same nano
# workloads measured by three harnesses (this crate's own runner, Criterion,
# Divan) so the trade-offs are visible side by side. Dev-only, so they never
# touch the pkcore dependency graph.
[dev-dependencies]
criterion = "0.7"
divan = "0.1"

[[bench]]
name = "criterion"
harness = false

[[bench]]
name = "divan"
harness = false

# Feature hooks for later phases. Phase 1 uses none of them.
[features]
default = []
equity = ["pkcore/equity"]
sim = ["pkcore/bot-profiles", "pkcore/hand-histories"]

# Symbols for samply profiling (design Section 6).
[profile.release]
debug = true
