# ---------------------------------------------------------------------------
# Transitions — tell. The surface is PokerSession (EPIC-124 0c), plus the
# Table creator a session wraps. Table's own methods are concepts here.
#
# PKError carries no `domain error` role yet (EPIC-124 0d, option A), so no
# transition has a `fails-with`. The PKError cases each one raises are listed
# as comments, for the PKError split.
# ---------------------------------------------------------------------------

[[transitions]]
id = "TR-from_seats_with_id"
ref = "casino::table::Table::from_seats_with_id"
doc = "Open a table: seat the players, fix the game and the forced bets."
emits = ["TableOpen", "PlayerSeated", "Dealt"]

[[transitions.arguments]]
param = "seats"
class = "fact"

[[transitions.arguments]]
param = "game"
class = "selection"

[[transitions.arguments]]
param = "forced"
class = "selection"

[[transitions.arguments]]
param = "id"
class = "entropy"

[[transitions]]
id = "TR-new"
ref = "casino::session::PokerSession::new"
doc = "Wrap a table in a session that sequences its hands."
emits = []

[[transitions.arguments]]
param = "table"
class = "state"

[[transitions]]
id = "TR-restore"
ref = "casino::session::PokerSession::restore"
doc = "Rebuild a session from the bytes snapshot wrote."
emits = []
# raises: SnapshotCorrupt, SnapshotVersion, InvalidCardIndex (all shell)

[[transitions.arguments]]
param = "bytes"
class = "state"

[[transitions]]
id = "TR-set_blinds"
ref = "casino::session::PokerSession::set_blinds"
doc = "Change the forced bets; a change during a hand waits for the next start (INV-5)."
emits = []

[[transitions.arguments]]
param = "forced"
class = "selection"

[[transitions]]
id = "TR-eliminate_busted"
ref = "casino::session::PokerSession::eliminate_busted"
doc = "Remove every seat with no chips, between hands."
emits = []

[[transitions]]
id = "TR-start_hand"
ref = "casino::session::PokerSession::start_hand"
doc = "Shuffle with OS randomness and start a hand. Only with the `entropy` feature; start_hand_with is the pure twin."
emits = ["ForcedBetSmallBlind", "ForcedBetBigBlind", "BetAnteForced", "ActionTo", "DealingXCards", "DealtPlayers", "Dealt", "StudBringInPost"]
# raises: whatever forced bets or dealing raise, e.g. NotEnoughCards

[[transitions]]
id = "TR-start_hand_with"
ref = "casino::session::PokerSession::start_hand_with"
doc = "Shuffle with the caller's RNG, post forced bets, deal the first cards."
emits = ["ForcedBetSmallBlind", "ForcedBetBigBlind", "BetAnteForced", "ActionTo", "DealingXCards", "DealtPlayers", "Dealt", "StudBringInPost"]

[[transitions.arguments]]
param = "rng"
class = "entropy"

[[transitions]]
id = "TR-start_hand_with_deck"
ref = "casino::session::PokerSession::start_hand_with_deck"
doc = "Start a hand from the caller's deck, without shuffling it."
emits = ["ForcedBetSmallBlind", "ForcedBetBigBlind", "BetAnteForced", "ActionTo", "DealingXCards", "DealtPlayers", "Dealt", "StudBringInPost"]
# raises: InvalidCardCount when the deck is not 52 cards

[[transitions.arguments]]
param = "deck"
class = "entropy"

[[transitions]]
id = "TR-next_actor"
ref = "casino::session::PokerSession::next_actor"
doc = "Name the seat to act; when betting on a street is closed, sweep the bets and deal the next street first."
emits = ["BringItIn", "PotSize", "DealtFlop", "DealtTurn", "DealtRiver", "DealingXCards", "Dealt"]
# raises: NotEnoughCards, AlreadyDealt — after the sweep, so the street can
# half-happen (OB-5, docs/KERNEL_ADR.md §5)

[[transitions]]
id = "TR-next_step"
ref = "casino::session::PokerSession::next_step"
doc = "As next_actor, but folds every outcome into one SessionStep."
emits = ["BringItIn", "PotSize", "DealtFlop", "DealtTurn", "DealtRiver", "DealingXCards", "Dealt"]

[[transitions]]
id = "TR-apply_action"
ref = "casino::session::PokerSession::apply_action"
doc = "One seat acts: changes that seat, the bet and the street counters; never the board or the phase."
emits = ["Check", "Bet", "Call", "Raise", "AllIn", "Fold", "ActionTo", "BringItIn", "PotSize", "MuckPlayerCards", "TakePlayerCards"]
# raises: TableActionOutOfOrder, InsufficientChips, InvalidBetSize,
# RaiseCapReached, InvalidAction, ...

[[transitions.arguments]]
param = "seat"
class = "fact"

[[transitions.arguments]]
param = "action"
class = "judgment"

[[transitions]]
id = "TR-end_hand"
ref = "casino::session::PokerSession::end_hand"
doc = "Show down, pay the pots, audit the chips and reset the table for the next hand."
emits = ["PlayerWins", "PlayerLoses", "PlayerWinsMainPot", "PlayerWinsSidePot", "CloseItOut", "BringItIn", "PotSize", "EndHand", "ResetTable", "DeckPassesAudit", "MuckCards", "MuckPlayerCards", "TakePlayerCards"]
# raises: ActionIsntFinished when the hand is not over; ChipAuditFailed

[[transitions]]
id = "TR-abort_hand"
ref = "casino::session::PokerSession::abort_hand"
doc = "Refund every chip put in this hand and reset the table."
emits = ["HandAborted", "ResetTable", "DeckPassesAudit", "MuckCards", "MuckPlayerCards", "TakePlayerCards"]
# raises: ChipAuditFailed when the unwind does not balance

# ---------------------------------------------------------------------------
# Reads — ask
# ---------------------------------------------------------------------------

[[reads]]
id = "RD-view"
ref = "casino::session::PokerSession::view"
answers = "What may this viewer see of the table right now?"

[[reads.arguments]]
param = "viewer"
class = "selection"

[[reads.does-not-answer]]
question = "Who is winning the hand?"
where = "analysis::equity, or Table::equity, on the unredacted table. A view carries no equity and no deck (INV-10)."

[[reads]]
id = "RD-legal_actions"
ref = "casino::table::Table::legal_actions"
answers = "Which actions may this seat take now?"

[[reads.arguments]]
param = "seat_id"
class = "fact"

[[reads.does-not-answer]]
question = "Which of these actions is a good one?"
where = "The bot module, or the player. The kernel never picks an action."

[[reads]]
id = "RD-is_hand_complete"
ref = "casino::session::PokerSession::is_hand_complete"
answers = "Is the current hand over, so end_hand may run?"

[[reads.arguments]]
param = "self"
class = "state"

[[reads]]
id = "RD-is_hand_in_progress"
ref = "casino::session::PokerSession::is_hand_in_progress"
answers = "Has a hand started and not yet ended?"

[[reads.arguments]]
param = "self"
class = "state"

[[reads]]
id = "RD-count_funded"
ref = "casino::session::PokerSession::count_funded"
answers = "How many seats have chips to play the next hand?"

[[reads.arguments]]
param = "self"
class = "state"

[[reads]]
id = "RD-forced_at_hand_start"
ref = "casino::session::PokerSession::forced_at_hand_start"
answers = "Which forced bets did this hand post?"

[[reads.arguments]]
param = "self"
class = "state"

[[reads]]
id = "RD-snapshot"
ref = "casino::session::PokerSession::snapshot"
answers = "What is the whole session, as versioned bytes restore accepts?"

[[reads.arguments]]
param = "self"
class = "state"
# raises: SnapshotCorrupt (shell)

[[reads.does-not-answer]]
question = "What may a player see?"
where = "RD-view. A snapshot holds the deck and every hole card; it is for the store, never the wire."

# ---------------------------------------------------------------------------
# Obligations — what the shell must do, and why
# ---------------------------------------------------------------------------

[[obligations]]
id = "OB-1"
about = "PokerSession"
doc = "Write no table state. Change a table only through the transitions above; show it only through view."
rationale = "One owner, others ask (docs/KERNEL_ADR.md §6). A shell that writes chips or redacts cards keeps a second copy of the rule. The 22 public mutable fields stay open until purity audit fix 12 seals them."

[[obligations]]
id = "OB-2"
about = "casino::session::PokerSession::apply_action"
doc = "Do not re-check a rule apply_action enforces. Ask legal_actions before, and pass apply_action's error through after."
rationale = "A second check drifts from the kernel's (INV-2). The error from apply_action is the answer."

[[obligations]]
id = "OB-3"
about = "PokerSession"
doc = "Own every clock: action timers, time banks, blind levels by time."
rationale = "The kernel reads no clock. A blind level is a set_blinds call the shell makes when its clock says so."

[[obligations]]
id = "OB-4"
about = "casino::session::PokerSession::start_hand_with"
doc = "Supply the randomness: an RNG to start_hand_with, or a shuffled deck to start_hand_with_deck. Keep the seed or the deck to replay the hand."
rationale = "The `--no-default-features` kernel has no randomness of its own (docs/KERNEL_PURITY_AUDIT.md fix 8). start_hand reads the OS only with the `entropy` feature."

[[obligations]]
id = "OB-5"
about = "casino::session::PokerSession::next_actor"
doc = "On an error from next_actor or next_step, call abort_hand. Do not continue the hand."
rationale = "Advancing a street sweeps the bets, then deals. If the deal fails, the street is half done and no GamePhase names that state (docs/KERNEL_ADR.md §5, purity audit fix 5)."

[[obligations]]
id = "OB-6"
about = "casino::table::Table::button_up"
doc = "Move the button between hands: call session.table.button_up() after end_hand. This is the one table write OB-1 allows today."
rationale = "PokerSession never moves the button; only Dealer does. Until a session step owns it, no transition on this surface emits MoveButton (EPIC-124 follow-up)."
