# The pkcore kernel ontology (EPIC-124). Checked by the dkskills
# kernel-ontology checker; `make ontology` once Phase 8 lands.
#
# Roles live in the `# Domain` blocks and pins in the tests; this file holds
# neither. IDs are stable: never renumber an INV-, TR-, RD- or OB- id.

package = "pkcore"          # no WIT world yet (docs/KERNEL_ADR.md §7)
world = "none"
summary = """One hand at one table: who may act, what each action does to \
chips, pot and board, and who wins; plus the pure reads over hands that ship \
by default: evaluation, equity, player stats and the heads-up chart. \
Storage, transport, accounts, clocks and bot decisions are the shell's."""

# ---------------------------------------------------------------------------
# Not this kernel. Scope is the default feature set (EPIC-124 0b, option B).
# ---------------------------------------------------------------------------
[[not-this-kernel]]
ref = "bot"
why = "bot deciders and self-play simulation; they choose actions, the kernel only applies them"

[[not-this-kernel]]
ref = "hand_history"
why = "YAML hand-history records and replay; a shell format over finished hands"

[[not-this-kernel]]
ref = "pokerbench"
why = "HuggingFace PokerBench dataset reader; behind the opt-in `pokerbench` feature"

[[not-this-kernel]]
ref = "util"
why = "console, CSV and test-data helpers; no domain rule"

[[not-this-kernel]]
ref = "games::kuhn"
why = "Kuhn poker, a separate toy game with its own rules"

[[not-this-kernel]]
ref = "analysis::gto"
why = "heads-up GTO solver; a sibling engine that reads hands and never changes a table"

[[not-this-kernel]]
ref = "analysis::nubibus"
why = "Pluribus log parser; a translator for one external format"

[[not-this-kernel]]
ref = "analysis::player_stats_store"
why = "YAML persistence for player stats; behind the opt-in `player-stats-persistence` feature"

[[not-this-kernel]]
ref = "analysis::store::bcm"
why = "binary card map storage; on-disk layer behind the opt-in `store` feature"

[[not-this-kernel]]
ref = "analysis::store::db"
why = "SQLite storage; on-disk layer behind the opt-in `store` feature"

[[not-this-kernel]]
ref = "casino::dealer"
why = "a convenience driver, not the canonical one (src/casino/dealer.rs:8); PokerSession is"

