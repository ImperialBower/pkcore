# pkcore Hand History Format v1
# "The Hand" — Gus Hansen vs Daniel Negreanu
# High Stakes Poker Season 2, Episode 11 (GSN, 2006, at the Palms)
# https://www.youtube.com/watch?v=vjM60lqRhPg
#
# RECORDED, not typed (DEFECT_040). This file is the output of
#   cargo run --features full --example record_the_hand
# with this header put back on top. The engine wrote the pots, the nets and
# the hand ranks. Change the hand in TestData::the_hand_broadcast_table or
# TestData::the_hand_line and record it again; do not edit it by hand.
#
# From the broadcast: $300/$600 with a $100 ante, the button on Doyle Brunson
# (seat 0), the eight players' cards, the action, Gus Hansen's 287,100 stack
# (his river all in) and the final pot of 575,700.
#
# ESTIMATE — not from the broadcast; read off the episode to replace:
#   Daniel Negreanu (seat 4) 387,100 (he had to cover Hansen's 287,100), and
#   100,000 each for the six who fold: Doyle Brunson (seat 0), Eli Elezra
#   (seat 1), Antonio Esfandiari (seat 2), Cory Zeidman (seat 5), Barry
#   Greenstein (seat 6) and Amnon Filippi (seat 7). They change no pot, no
#   action and no result.
# The burn cards are not from the broadcast either.
#
# Sources:
#   https://www.cardplayer.com/poker-news/1640563-daniel-negreanu-gus-hansen-break-down-iconic-high-stakes-poker-hand
#   https://www.pokernews.com/news/2010/02/most-memorable-hands-from-high-stakes-poker-part-2-7900.htm
#   https://www.pokerlistings.com/news/hand-of-the-week-gus-buries-daniel-with-perfectly-hidden-quads-67089
#
# Seats are 0-based. A call's amount is the chips it adds; a bet's, raise's
# or all in's is the player's total for the street after it.
#
# hand_rank uses pkcore's HandRank type:
#   name: HandRankName  — broad category (FullHouse, FourOfAKind, etc.)
#   class: HandRankClass — specific hand (SixesOverFives, FourFives, etc.)
#   value: HandRankValue — CKC integer (1 = Royal Flush, 7462 = worst high card)

