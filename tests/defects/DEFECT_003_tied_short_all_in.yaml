# DEFECT_003 — heads-up side pot: the uncalled excess was not returned.
# docs/defects/DEFECT_003_heads_up_side_pot.md — tests/split_pots.rs
#
# NL 50/100, heads-up. Seat 0 (button, small blind, acts first) has 1000 and
# shoves. Seat 1 (big blind) has 200 and calls all-in. Both players play the board (four aces, king). The tie splits only the
# matched 400; the deep stack's uncalled 800 comes back.
pkcore_version: "0.16.0"
format_version: 1
hand:
  id: DEFECT_003_tied_short_all_in
  game: holdem
  description: "Heads-up tie with a short all-in: each player keeps exactly what they had"
table:
  seats: 2
  button: 0
  stakes: { small_blind: 50.0, big_blind: 100.0 }
players:
  - { seat: 0, name: Deep, stack: 1000.0, hole_cards: "7♦ 2♣" }
  - { seat: 1, name: Short, stack: 200.0, hole_cards: "4♦ 5♦" }
board: "A♥ A♦ A♣ A♠ K♥"
streets:
  preflop:
    actions:
      - { seat: 0, action: all_in, all_in: true }
      - { seat: 1, action: all_in, all_in: true }
  flop:
    cards: "A♥ A♦ A♣"
    actions: []
  turn:
    card: "A♠"
    actions: []
  river:
    card: "K♥"
    actions: []

final:
  stacks: { 0: 1000, 1: 200 }
