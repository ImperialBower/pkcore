# DEFECT_014 — replay rebuilt the table with the wrong number of chairs.
# docs/defects/DEFECT_014_replay_table_size.md — src/hand_history.rs
#
# A recorded dead-button hand. The small blind is owed by empty chair 7, past
# both the button (6) and the last occupied seat. Replay must size the table
# to hold chair 7; sizing it 7 chairs moved both blinds and every turn.
# This is the `DEAD_BUTTON_HAND` fixture from src/hand_history.rs.
