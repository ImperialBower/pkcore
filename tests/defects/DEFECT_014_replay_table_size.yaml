  source: regression
  description: "A dead small blind past the last occupied seat replays in order"
table:
  name: regression
  seats: 5
  button: 6
  stakes: { small_blind: 50.0, big_blind: 100.0 }
  betting_structure: { kind: no_limit }
players:
  - { seat: 0, name: gto, stack: 1393956.0, hole_cards: "6♣ 3♥" }
  - { seat: 1, name: tight_passive, stack: 2992725.0, hole_cards: "A♥ 7♠" }
  - { seat: 3, name: tight_aggressive, stack: 997174.0, hole_cards: "K♥ Q♠" }
  - { seat: 4, name: loose_passive, stack: 1621474.0, hole_cards: "6♦ 5♦" }
  - { seat: 6, name: abc, stack: 994671.0, hole_cards: "K♦ 9♠" }
streets:
  preflop:
    actions:
      - { seat: 7, action: post, amount: 0.0 }
      - { seat: 0, action: post, amount: 100.0 }
      - { seat: 1, action: fold }
