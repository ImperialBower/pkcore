# DEFECT_007 regression harness: every bot action must be legal across all four
# betting shapes. Needs `bot-profiles` for the shipped profiles and the session
# driver that `hand-histories` pulls in.
[[test]]
name = "bot_action_legality"
required-features = ["hand-histories", "bot-profiles"]

# DEFECT_008 conformance harness: worked examples from the TDA 2024 Illustration
# Addendum. Deliberately carries NO `required-features` — it exercises only the
# core table and betting-structure API and must keep building under
# `--no-default-features`. Four assertions are `#[ignore]`d as known defects
# (D8-1..D8-4): `cargo test --test tda_conformance -- --include-ignored`.
[[test]]
name = "tda_conformance"

[[test]]
name = "pkarena0_session"
required-features = ["hand-histories", "bot-profiles"]

[[test]]
name = "hand_history_legacy_yaml"
required-features = ["hand-histories"]

[[test]]
name = "player_stats_consistency"
required-features = ["bot-profiles", "hand-histories", "player-stats"]

[[test]]
name = "player_stats_persistence"
required-features = ["bot-profiles", "hand-histories", "player-stats-persistence"]

[[test]]
name = "exploitative_play_smoke"
required-features = ["bot-profiles", "player-stats"]

# DEFECT_004 regression: `SimTable` must play every betting street to
# completion. Uses `ExploitativeDecider`, which lives behind `player-stats`.
[[test]]
name = "sim_street_completion"
required-features = ["bot-profiles", "player-stats"]

[[test]]
name = "training_integration"
required-features = ["bot-training"]

