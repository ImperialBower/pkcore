[package]
name = "pkcore"
description = "Prototype core poker library."
version = "0.18.0"
rust-version = "1.94.1"
edition = "2024"
authors = ["electronicpanopticon <gaoler@electronicpanopticon.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ImperialBower/pkcore.git"
homepage = "https://github.com/ImperialBower/pkcore"
keywords = ["poker", "holdem", "omaha", "equity", "cards"]
categories = ["games", "algorithms", "simulation"]
exclude = [".github/workflows/*", "data/*", "docs/*", "benches/*", "examples/*", "generated/hups.db", "generated/old/*", "generated/kuhn-repl-history", "proto/*", "scripts/*", ".gitignore", "Cargo.lock", ".claude", "CLAUDE.md", "DIARY.md", "marathon_failure.yaml", "perf/*", "*.epub"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# docs.rs builds with all features so gated items (pokerbench, bot-training,
# debug-json, generators) render with their "available on feature X" banners.
[package.metadata.docs.rs]
all-features = true

# Package-wide lint configuration. These lived as `#![warn(...)]` /
# `#![allow(...)]` at the top of `src/lib.rs`, which only covered the lib
# target; here they cover every target in the package (lib, examples, tests,
# benches). `pedantic` needs `priority = -1` so the individual `allow`s below
# still win against the group. `perf/` is a separate workspace and does not
# inherit any of this.
[lints.rust]
non_upper_case_globals = "allow"
macro_expanded_macro_exports_accessed_by_absolute_paths = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_inception = "allow"
upper_case_acronyms = "allow"

[features]
## Pure by default (0.16.0, docs/KERNEL_PURITY_AUDIT.md fix 1): a plain
## `cargo add pkcore` gets the kernel — table engine, evaluation, equity, the
## player-stats aggregator and the embedded heads-up chart — and no format crate,
## file helper or thread pool. `make check-purity` asserts this on the default
## tree as well as on `--no-default-features`.
##
## The YAML surfaces (`bot-profiles`, `hand-histories`,
## `player-stats-persistence`), rayon (`parallel`), and the JSON and CSV helpers
## (`json`, `csv`), the filesystem wrappers (`persistence`) and the console
## helpers (`terminal`) are opt-in. `full` turns all of them on, which restores
## everything that was on by default before 0.16.0; use it to get the old
## behaviour back, and for `cargo test`, the examples, and `make`.
default = [
    "player-stats",
    "equity",
    "hup-charts",
    "entropy",
]
full = [
    "bot-profiles",
    "hand-histories",
    "player-stats",
    "player-stats-persistence",
    "equity",
    "parallel",
    "hup-charts",
    "json",
    "csv",
    "persistence",
    "terminal",
    "entropy",
]
## OS nondeterminism — randomness and the wall clock (0.18.0,
## docs/KERNEL_PURITY_AUDIT.md fix 8). On by default. It backs the
## conveniences that pick a random id or seed for you: `Player::new`,
## `Table::from_seats` and the `*_from_seats` constructors, the `shuffle`
## helpers, `Table::act_shuffle_deck`, `PokerSession::start_hand` /
## `run_hand`, `BotDecider::decide` / `on_new_hand`, `JokerDecider::new`,
## `casino::dealer`, and a seedless `EquityRequest` or `SimTable`. Each has a
## twin that takes the id, seed or RNG, and core code uses only the twins, so
## the `--no-default-features` build reads no OS randomness (`make
## check-purity` fails on `getrandom` there).
entropy = ["rand/os_rng", "rand/thread_rng", "uuid/v4", "dep:getrandom_v3"]
## Filesystem convenience wrappers over the pure serializers:
## `SolverResult::save`/`load` (+ `_binary`, `_json`), `BotProfile::to_file`/
## `from_file`, `HandCollection::save`, `Pluribus::read_in_log`. Each has a
## pure twin that works on bytes or strings and is always available.
persistence = []
## Enables the on-disk storage layer.
store = ["dep:rusqlite", "dep:zstd", "csv"]
## Console helpers for the examples' REPLs: `Terminal::receive_*` (stdin and
## stdout) and `Terminal::pause` (termion raw mode, unix only).
terminal = ["dep:termion"]
## `SolverResult::to_json_string` / `from_json_str` / `save_json` / `load_json`.
json = ["dep:serde_json"]
## CSV file helpers: `SortedHeadsUp::generate_csv` / `read_csv`,
## `IndexCardMap::generate_csv`, and the `util::csv` module.
csv = ["dep:csv"]
## When enabled, `SolverResult::save` and `SolverResult::load` use human-readable JSON
debug-json = ["json"]
## Enables the pure compute multi-way equity engine in `analysis::equity`
## (exact enumeration plus seeded Monte Carlo). Parallelism is a separate axis:
## with `parallel` the engine fans out across rayon, without it the same
## computation runs serially and returns identical results.
equity = []
## Enables rayon-backed parallelism: the `par_*` methods on `Pile`, `Cards` and
## `Deck`, and the multi-threaded drivers inside the equity engine, range equity
## and turn evaluation.
##
## Off by default since 0.16.0 (in `full`). **Not** available on
## `wasm32-unknown-unknown`, which has no threads to spawn — a browser build must
## leave it off, or the thread pool it links can never run. Turning it off
## removes `rayon` and `rayon-core` from the dependency tree entirely and drops
## every rayon type from the public API; results are unchanged, only slower.
parallel = ["dep:rayon", "indexmap/rayon"]
## Enables YAML serialization/deserialization for `BotProfile` etc
bot-profiles = ["dep:serde_yaml_bw"]
## Enables YAML serialization/deserialization for `HandHistory` etc
hand-histories = ["dep:serde_yaml_bw"]
## Enables the per-player aggregator in `analysis::player_stats`
player-stats = []
## Enables on-disk persistence for `StatsRegistry`
player-stats-persistence = ["player-stats", "dep:serde_yaml_bw"]
## Enables `ExploitConfig` YAML serialisation
bot-training = ["player-stats", "bot-profiles", "dep:serde_yaml_bw"]
## Links the embedded heads-up preflop chart (`generated/hups.bin`) into the
## binary, which is what `preflop_charts: hup` reads.
##
## On by default. It is a separate axis because the chart is **15.8 MB** and the
## knob that reads it is a *runtime* value, so the linker cannot drop the blob
## on the strength of a profile setting alone — a WASM consumer measured an
## 8x larger download for it. Turning it off removes the chart and every function
## that reads it (`HUPResult::lookup`, `SortedHeadsUp::hup_result`,
## `Versus::hups_at_deal`, `hup_equity_vs_range`) from the public API, and makes `preflop_charts: hup` return no answer, so the
## decider falls back to the preflop frequency roll. `preflop_charts: solver`
## does not read the chart and is unaffected; multi-way tables need `solver`
## anyway. See EPIC-39 corrigendum 16.
hup-charts = []

## Enables the HuggingFace `pokerbench` module.
pokerbench = ["csv", "json"]
## Enables historical offline generator inputs (e.g. `UNIQUE_HANDS`, the distinct
## 5-card hand enumeration read from a self-generated file).
generators = []

[dependencies]
cardpack = "0.11.1"
bitvec = { version = "1.1", features = ["alloc",  "atomic", "std", "serde", "testing" ] }
csv = { version = "1.4", optional = true }
indexmap = { version = "2.12" }
itertools = "0.14"
log = "0.4"
percent-encoding = "2.3"
# No OS entropy unless the `entropy` feature asks for it: seeded `StdRng` /
# `SmallRng` only.
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "small_rng"] }
rayon = { version = "1.11.0", optional = true }
regex = { version = "1.12", features = [] }
# `default-features = false` drops postcard's default `heapless-cas` feature, which
# otherwise pulls `heapless 0.7 → atomic-polyfill` (unmaintained, RUSTSEC-2023-0089).
# pkcore only uses `to_allocvec`/`from_bytes`, which need `alloc`/`use-std`, not heapless.
postcard = { version = "1", default-features = false, features = ["alloc", "use-std"] }
serde_yaml_bw = { version = "2.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
thousands = "0.2.0"
uuid = { version = "1.22", features = ["serde", "v5"] }
wincounter = "0.1.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.34", optional = true, features = ["bundled"] } # 0.35 breaks HUPResult https://github.com/rusqlite/rusqlite/releases#reactions--reaction_button_component-a0702b
zstd = { version = "0.13", optional = true }

[target.'cfg(unix)'.dependencies]
termion = { version = "4.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v3 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
uuid = { version = "1.22", features = ["serde", "v5", "js"] }

