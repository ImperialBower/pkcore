[package]
name = "pkcore"
description = "Prototype core poker library."
version = "0.0.44"
rust-version = "1.94.1"
edition = "2024"
authors = ["electronicpanopticon <gaoler@electronicpanopticon.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ImperialBower/pkcore.git"
homepage = "https://github.com/ImperialBower/pkcore"
exclude = [".github/workflows/*", "data/*", "docs/*", "examples/*", "generated/hups.db", "generated/old/*", "proto/*", "scripts/*", ".gitignore", "Cargo.lock", ".claude", "Claude.md"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
## Default features enable the bot-profiles and hand-histories YAML support so
## that examples (e.g. interactive_play) work with a plain `cargo run --example`.
default = ["bot-profiles", "hand-histories"]
## When enabled, `SolverResult::save` and `SolverResult::load` use human-readable
## JSON instead of the default compact binary (postcard) format. Useful for
## inspecting solver output during development. The explicit `save_json` /
## `load_json` and `save_binary` / `load_binary` methods are always available
## regardless of this flag.
debug-json = []
## Enables YAML serialization/deserialization for `BotProfile` and related
## types in the `bot` module. Adds a `serde_yaml_bw` dependency.
bot-profiles = ["dep:serde_yaml_bw"]
## Enables YAML serialization/deserialization for `HandHistory` and related
## types in the `hand_history` module. Adds a `serde_yaml_bw` dependency.
hand-histories = ["dep:serde_yaml_bw"]

[dependencies]
bint = "0.1.15"
cardpack = "0.6.9"
bitvec = { version = "1.0.1", features = ["alloc",  "atomic", "std", "serde", "testing" ] }
csv = "1.4"
dotenvy = "0.15"
indexmap = { version = "2.12", features = ["rayon"] }
itertools = "0.14"
log = "0.4"
percent-encoding = "2.3"
pkstate = "0.1.2"
rand = "0.9"
random_name_generator = "0.3.6" 
rayon = "1.11.0"
regex = { version = "1.12", features = [] }
postcard = { version = "1", features = ["alloc", "use-std"] }
serde_yaml_bw = { version = "2.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
thousands = "0.2.0"
uuid = { version = "1.22", features = ["serde", "v4"] }
wincounter = "0.1.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.34", features = ["bundled"] } # 0.35 breaks HUPResult https://github.com/rusqlite/rusqlite/releases#reactions--reaction_button_component-a0702b
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
termion = "4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_v3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.22", features = ["serde", "v4", "js"] }

[[example]]
name = "bot_selfplay"
required-features = ["bot-profiles", "hand-histories"]

[[example]]
name = "interactive_play"
required-features = ["bot-profiles", "hand-histories"]

[[example]]
name = "replay_play"
required-features = ["hand-histories"]

[[example]]
name = "yaml_audit"
required-features = ["hand-histories"]

[[test]]
name = "replay_consistency"
required-features = ["hand-histories", "bot-profiles"]

[[test]]
name = "bot_marathon"
required-features = ["hand-histories", "bot-profiles"]

[dev-dependencies]
serde_yaml_bw = "2.5"
clap = { version = "4.6", features = ["derive", "unicode"] }
clap-repl = "0.3.2"
reedline = "0.38"
elr_primes = "0.1.2"
env_logger = "0.11.9"

rstest = "0.26.1"
serde_test = "1.0.177"
testing_logger = "0.1.1"
#ratatui = { version = "0.30", features = ["all-widgets"] }
test-log = "0.2.19"

