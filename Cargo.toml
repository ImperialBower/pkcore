[package]
name = "pkcore"
description = "Prototype core poker library."
version = "0.8.2"
rust-version = "1.94.1"
edition = "2024"
authors = ["electronicpanopticon <gaoler@electronicpanopticon.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ImperialBower/pkcore.git"
homepage = "https://github.com/ImperialBower/pkcore"
keywords = ["poker", "holdem", "omaha", "equity", "cards"]
categories = ["games", "algorithms", "simulation"]
exclude = [".github/workflows/*", "data/*", "docs/*", "benches/*", "examples/*", "generated/hups.db", "generated/old/*", "generated/kuhn-repl-history", "proto/*", "scripts/*", ".gitignore", "Cargo.lock", ".claude", "CLAUDE.md", "DIARY.md", "marathon_failure.yaml", "perf/*", "*.epub"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# docs.rs builds with all features so gated items (pokerbench, bot-training,
# debug-json, generators) render with their "available on feature X" banners.
[package.metadata.docs.rs]
all-features = true

[features]
## Default features enable the full EPIC-26 stack (player-stats and the
## optional persistence layer) plus bot-profiles and hand-histories so that
## examples (e.g. interactive_play, player_stats_session) work with a plain
## `cargo run --example`.  Downstream consumers who don't need persistence
## can opt out with `default-features = false` and re-enable just what they
## want.
default = [
    "bot-profiles",
    "hand-histories",
    "player-stats",
    "player-stats-persistence",
    "equity",
    "store",
    "terminal",
]
## Enables the on-disk storage layer.
store = ["dep:rusqlite", "dep:zstd"]
## Enables the interactive terminal layer.
terminal = ["dep:termion"]
## When enabled, `SolverResult::save` and `SolverResult::load` use human-readable JSON
debug-json = []
## Enables the pure compute multi-way equity engine in `analysis::equity`
## (exact enumeration plus seeded Monte Carlo, parallelized with rayon).
equity = []
## Enables YAML serialization/deserialization for `BotProfile` etc
bot-profiles = ["dep:serde_yaml_bw"]
## Enables YAML serialization/deserialization for `HandHistory` etc
hand-histories = ["dep:serde_yaml_bw"]
## Enables the per-player aggregator in `analysis::player_stats`
player-stats = []
## Enables on-disk persistence for `StatsRegistry`
player-stats-persistence = ["player-stats", "dep:serde_yaml_bw"]
## Enables `ExploitConfig` YAML serialisation
bot-training = ["player-stats", "bot-profiles", "dep:serde_yaml_bw"]
## Enables the HuggingFace `pokerbench` module.
pokerbench = []
## Enables historical offline generator inputs (e.g. `UNIQUE_HANDS`, the distinct
## 5-card hand enumeration read from a self-generated file).
generators = []

[dependencies]
bint = "0.1.15"
cardpack = "0.6.9"
bitvec = { version = "1.1", features = ["alloc",  "atomic", "std", "serde", "testing" ] }
csv = "1.4"
indexmap = { version = "2.12", features = ["rayon"] }
itertools = "0.14"
log = "0.4"
percent-encoding = "2.3"
pkstate = "0.1.2"
rand = "0.9"
random_name_generator = "0.3.6" 
rayon = "1.11.0"
regex = { version = "1.12", features = [] }
# `default-features = false` drops postcard's default `heapless-cas` feature, which
# otherwise pulls `heapless 0.7 → atomic-polyfill` (unmaintained, RUSTSEC-2023-0089).
# pkcore only uses `to_allocvec`/`from_bytes`, which need `alloc`/`use-std`, not heapless.
postcard = { version = "1", default-features = false, features = ["alloc", "use-std"] }
serde_yaml_bw = { version = "2.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
thousands = "0.2.0"
uuid = { version = "1.22", features = ["serde", "v4", "v5"] }
wincounter = "0.1.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.34", optional = true, features = ["bundled"] } # 0.35 breaks HUPResult https://github.com/rusqlite/rusqlite/releases#reactions--reaction_button_component-a0702b
zstd = { version = "0.13", optional = true }

[target.'cfg(unix)'.dependencies]
termion = { version = "4.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_v3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.22", features = ["serde", "v4", "v5", "js"] }

[[example]]
name = "calc"
required-features = ["equity"]

# Golden-vector dumper for the /deconstruct regeneration pack
# (docs/deconstruct/). Exercises the equity engine, hand-history YAML
# round-trip + replay, bot profiles, and player stats, so it must not build
# under `--no-default-features`.
[[example]]
name = "decon_dump"
required-features = ["equity", "bot-profiles", "hand-histories", "player-stats"]

# Storage-backed tools: SQLite HUP store + zstd binary card map (audit II.11 /
# P7). Without `store`, `rusqlite`/`Sqlable`/`HUPResult` DB methods / BCM
# generation are absent, so these must not build under `--no-default-features`.
[[example]]
name = "audit"
required-features = ["store"]

[[example]]
name = "export_hups_bin"
required-features = ["store"]

[[example]]
name = "generate_bcm"
required-features = ["store"]

[[example]]
name = "hup_dump"
required-features = ["store"]

[[example]]
name = "insert_distinct"
required-features = ["store"]

[[example]]
name = "preflop"
required-features = ["store"]

# Uses `Terminal::pause` (raw-mode key reads), which is gated behind `terminal`.
