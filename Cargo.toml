[dev-dependencies]
clap = { version = "4.6", features = ["derive", "unicode"] }
clap-repl = "0.3.2"
criterion = "0.5"
elr_primes = "0.1.2"
env_logger = "0.11.9"
# `rayon` is optional for the library (the `parallel` feature) but unconditional
# here, so `examples/pluriboom.rs` and `tests/heavy_tests.rs` — which drive rayon
# directly rather than through pkcore — still build and run under
# `cargo test --no-default-features`. Dev-dependencies never reach a consumer,
# and `check-purity` reads `cargo tree -e no-dev`, so this does not weaken the
# purity gate.
rayon = "1.11.0"
reedline = "0.38"
serde_yaml_bw = "2.5"
# Optional for the library (`json` / `csv`) but unconditional here, for the
# round-trip tests that exercise serde derives through JSON and the pokerbench
# CSV error tests. Same reasoning as `rayon` above.
serde_json = "1.0"
csv = "1.4"
# Tests mint throwaway ids with `Uuid::new_v4()`.
uuid = { version = "1.22", features = ["v4"] }

rstest = "0.26.1"
serde_test = "1.0.177"
testing_logger = "0.1.1"
#ratatui = { version = "0.30", features = ["all-widgets"] }
test-log = "0.2.19"

[[bench]]
name = "preflop_odds"
harness = false
required-features = ["equity"]
