const NODES=[{"id": "architecture/layers", "type": "Architecture", "title": "Ecosystem layers", "description": "pkcore is the pure engine; pkdealer wraps it in gRPC; agents and web apps sit on top.", "tags": ["architecture", "layering", "grpc"], "group": "architecture", "sz": 29, "body": "# Layering\n\n```\nAI agents (Claude / OpenAI / rule-based)      Browsers\n        \u2502 gRPC (port 50051)                      \u2502 WebSocket/SSE\n        \u25bc                                        \u25bc\npkdealer workspace:  pkdealer_proto \u00b7 pkdealer_service \u00b7 pkdealer_spectator\n        \u2502\n        \u25bc\npkcore  (this crate \u2014 engine, analysis, bots; no network I/O)\n```\n\n* **pkcore** owns the rules: tables, evaluation, equity, bot profiles.\n  It stays a pure library \u2014 see [pkcore crate](/crate.md).\n* **pkdealer_service** is the table authority: it owns the pkcore\n  `Table` state, exposes the gRPC `DealerService`, broadcasts table\n  events, and emits OTel spans per action.\n* **pkdealer_spectator** subscribes to that event stream and serves an\n  SSE-driven spectator web view (all hole cards visible).\n* **Agents** are gRPC clients \u2014 random, rule-based (driven by pkcore\n  [bot profiles](/modules/bot.md)), and LLM-backed.\n\nThe full ecosystem \u2014 including the other consumers listed in\n[downstream repos](/ecosystem/downstream-repos.md) \u2014 is specified in\nthe repository ROADMAP.\n\n# Citations\n\n[1] [ROADMAP \u2014 Architecture Overview](https://github.com/ImperialBower/pkcore/blob/main/ROADMAP.md)"}, {"id": "architecture/table-vs-tablecelled", "type": "Design Decision", "title": "Table vs TableCelled", "description": "Two table engines coexist \u2014 the value-semantics Table is primary; TableCelled is the earlier Cell-based engine.", "tags": ["table", "interior-mutability", "design"], "group": "architecture", "sz": 29, "body": "# Decision\n\npkcore carries two table engines in [casino](/modules/casino.md):\n\n* `casino::table::Table` \u2014 plain value semantics, the primary engine.\n  Betting completion is an explicit query (`is_betting_complete()`),\n  decks are injected (deterministic tests), and completed hands are\n  assembled with `build_game()`.\n* `casino::table_celled::TableCelled` \u2014 the original engine using\n  interior mutability (`Cell`-based state).\n\n# History\n\nIn July 2026 the engines were renamed to make the preferred one the\ndefault name: `TableNoCell` became `Table`, and the old `Table` became\n`TableCelled`. Code and docs written before then use the old names \u2014\nread historical EPICs and defect reports with that mapping in mind.\n\n# Guidance\n\nNew orchestration work (sessions, transport, self-play) should build on\n`Table`. `TableCelled` remains for the code paths still bound to it;\nconsult the analysis document below before migrating or removing any.\n\n# Citations\n\n[1] [ANALYSIS_TableCelled_vs_Table](https://github.com/ImperialBower/pkcore/blob/main/docs/ANALYSIS_TableCelled_vs_Table.md)"}, {"id": "cactus-kev-lookup", "type": "concept", "title": "Cactus Kev Bit-Packed Card & Lookup Table Core", "description": "How pkcore packs cards into u32 values and evaluates 5-card hands via prime products and embedded lookup tables.", "tags": ["math", "performance", "evaluation", "lookups"], "group": "(root)", "sz": 46, "body": "# Cactus Kev Hand Evaluation Engine\n\n## \ud83c\udfd7\ufe0f Architectural Paradigm\nThe performance of `pkcore` rests on a modified implementation of Cactus Kev's 5-card poker hand evaluation algorithm. Rather than evaluating hands using heavy structural nested objects or runtime arrays, individual cards are modeled as deterministic `u32` newtype wrappers designed for fast bitwise execution.\n\nAn absolute masterclass in fast hand evaluation. Below is the strict, fully compliant Open Knowledge Format (OKF) declaration file for your Cactus Kev implementation within pkcore.\nCreate this file exactly at .okf/cactus-kev-lookup.md. It encodes the u32 bit-packing architecture, the mathematical lookup tables embedded in src/lookups/*, and details the lazy calculation loops that prevent token-heavy processing.\n\n---type: concept\ntitle: Cactus Kev Bit-Packed Card & Lookup Table Core\ntags: [math, performance, evaluation, lookups]\nreferences: [src/lookups/, src/card.rs, ckc-rs]\n---\n# Cactus Kev Hand Evaluation Engine## \ud83c\udfd7\ufe0f Architectural ParadigmThe performance of `pkcore` rests on a modified implementation of Cactus Kev's 5-card poker hand evaluation algorithm. Rather than evaluating hands using heavy structural nested objects or runtime arrays, individual cards are modeled as deterministic `u32` newtype wrappers designed for fast bitwise execution.\n\n\n+-----------------------------------+-----------------------------------+\n| Bit 31-16 | Bit 15-0 |\n| (Mathematical Math) | (Card Face Flags) |\n+-----------------------------------+-----------------------------------+\n| XXXX XXXX | Prime (Bits 7-0) | Suit (11-8) | Rank Hex (Bits 3-0) |\n+-----------------------------------+-----------------------------------+\n\n\n### 1. Bit-Packed Card Blueprint (`src/card.rs`)\nEach card uses a variation of Cactus Kev's binary encoding mapped inside a single 4-byte `u32` slot:\n* **Bits 0-3 (Rank Hex)**: The face value of the card represented as an integer (`Deuce = 0`, `Ace = 12`).\n* **Bits 4-7 (Rank Bitmask)**: A specific single bit turned on signifying the rank (`Deuce = 1`, `Ace = 4096`). Used to deduplicate cards and identify flushes.\n* **Bits 8-11 (Suit Bitmask)**: Active bit flags signifying the card's suit status (`Spades`, `Hearts`, `Diamonds`, `Clubs`).\n* **Bits 16-23 (Prime Identifier)**: A unique prime number assigned sequentially to the card rank (`Deuce = 2`, `Tray = 3`, `Four = 5` up to `Ace = 41`).\n\n---\n\n## \ud83d\udcbe Lookup Tables Map (`src/lookups/*`)\nBecause evaluation structures are embedded natively within the compiled crate binary, runtime checks operate at a lightning-fast `O(1)` performance tier (~50ns execution times) without disk read operations or runtime vectors.\n\n### 2. Multiplicative Prime Evaluation\nTo evaluate a standard 5-card poker combination, `pkcore` multiplies the prime bytes (Bits 16-23) of all five cards together.\n* **The Prime Rule**: The resulting product is mathematically unique to that exact configuration of five card ranks, ignoring suit permutations.\n* **Flush Evaluation Guard**: If the bitwise `AND` of all suit flags (Bits 8-11) returns a non-zero value, the evaluator shortcuts straight to the dedicated static `FLUSH` array.\n* **Binary Search Fail-Safe**: Non-flush values are ran through a binary search lookup array to instantly pull their integer hand rank value (`1` for Royal Flush, `7462` for worst trash high-card).\n\n---\n\n## \ud83d\udd00 Beyond 5 Cards (Hold'em and Omaha Extensions)\nCactus Kev's original design is limited to a isolated 5-card vector. `pkcore` extends this logic gracefully for multi-card games via the internal dependencies folded from `ckc-rs`:\n\n* **Texas Hold'em (7 Cards)**: Uses a lazy combination generator mapping `7 choose 5` layouts. It checks all 21 combinations without dynamic dynamic allocations, identifying the absolute lowest integer score value as the winner.\n* **Pot-Limit Omaha (9 Cards)**: Restricts combinations strictly by isolating `4 choose 2` hole cards and multiplying them against `5 choose 3` community cards, computing 60 total lookups instantly.\n\n---\n\n## \u26a0\ufe0f Implementation Invariants (Do Not Break)\nWhen refactoring or expanding code inside `src/` or adding new variants, Claude must satisfy these execution constraints:\n* **Zero Allocation**: Hand evaluation blocks must never request memory dynamic extensions (`Vec`, `Box`, `String`) on the active runtime stack.\n* **Integers Only**: All comparisons use raw integer comparison metrics (`u16`/`u32`). Stronger poker hands always return a numerically **lower value** score than weaker hands."}, {"id": "crate", "type": "Rust Crate", "title": "pkcore", "description": "Core poker library \u2014 cards, hand evaluation, equity, GTO analysis, bots, and full game simulation.", "tags": ["rust", "poker", "library", "core"], "group": "(root)", "sz": 34, "body": "# Overview\n\n`pkcore` (v0.3.2, Rust edition 2024) is the core poker engine of the\nImperialBower poker ecosystem. It provides:\n\n* Card and deck manipulation with efficient `u32` bit representations \u2014\n  see [cards module](/modules/cards.md).\n* Hand evaluation (5-card, 7-card, 8-or-better low) and equity/GTO\n  analysis \u2014 see [analysis module](/modules/analysis.md).\n* Full game simulation with betting rounds, side pots, and sessions \u2014\n  see [casino module](/modules/casino.md) and\n  [games module](/modules/games.md).\n* Serializable bot personalities and deciders \u2014 see\n  [bot module](/modules/bot.md).\n\nIt is a library-first crate: services like pkdealer and the web apps in\n[downstream repos](/ecosystem/downstream-repos.md) consume its public\nAPI rather than pkcore hosting any I/O of its own beyond opt-in\nfeatures.\n\n# Feature flags\n\nDefault features enable the full player-stats stack plus bot profiles\nand hand histories so examples run with a plain `cargo run --example`.\nDownstream consumers can opt out with `default-features = false`.\n\n| Feature | Purpose |\n|---|---|\n| `store` | On-disk storage layer (`rusqlite`, `zstd`). |\n| `terminal` | Interactive terminal layer (`termion`). |\n| `equity` | Pure-compute multi-way equity engine in `analysis::equity` (exact enumeration + seeded Monte Carlo, parallelized with rayon). |\n| `bot-profiles` | YAML serialization for `BotProfile` (`serde_yaml_bw`). |\n| `hand-histories` | YAML serialization for `HandHistory`. |\n| `player-stats` / `player-stats-persistence` | Per-player aggregator and its optional persistence. |\n| `debug-json` | Human-readable JSON for `SolverResult::save`/`load`. |\n\n# Lint posture\n\nThe crate warns on `clippy::pedantic`, `clippy::unwrap_used`, and\n`clippy::expect_used` at the crate root \u2014 library code must not\n`unwrap()`/`expect()`/`panic!()`. See\n[testing conventions](/processes/testing-conventions.md).\n\n# Citations\n\n[1] [README](https://github.com/ImperialBower/pkcore/blob/main/README.md)\n[2] [ROADMAP](https://github.com/ImperialBower/pkcore/blob/main/ROADMAP.md)"}, {"id": "data/bot-profiles", "type": "Dataset", "title": "Bot profiles", "description": "BotProfile YAML personalities in data/bots/ (per-variant subdirectories) and the trained exploitative-decider config.", "tags": ["bots", "yaml", "profiles", "exploitative"], "group": "data", "sz": 31, "body": "# Layout\n\n* `data/bots/*.yaml` \u2014 NLHE personalities: `gto`, `loose_aggressive`,\n  `loose_passive`, `maniac`, `short_stack_ninja`, `strong_all_on`,\n  `abc`.\n* `data/bots/{flhe,plo,razz}/` \u2014 per-variant profiles (e.g.\n  `tight_aggressive_plo.yaml`).\n* `data/exploit_configs/tag_trained.yaml` \u2014 trained thresholds and\n  multipliers for the `ExploitativeDecider` (EPIC-28 profile training):\n  VPIP/PFR/aggression/WTSD thresholds and bluff/aggression multipliers,\n  with optimizer-tuned float values.\n\nLoaded via `serde_yaml_bw` behind the `bot-profiles` feature \u2014 see the\n[bot module](/modules/bot.md).\n\n# Schema\n\nTop-level shape of a `BotProfile` YAML:\n\n| Key | Content |\n|---|---|\n| `name`, `description`, `style` | Identity; `style` is the archetype tag (e.g. `gto`). |\n| `range_strategy` | `open_raise`, `three_bet`, `call_three_bet` as range-notation strings (weighted entries like `JJ:0.95` supported), plus `postflop_cbet_frequency`. |\n| `betting_strategy` | `aggression_factor`, `bluff_frequency`, `check_raise_frequency`, `preferred_bet_sizes` (fractions like `1/3`). |\n| `playbook.entries.{N}` | Per-table-size position ranges: `position_ranges.ranges.{LJ,HJ,BTN,SB,BB,\u2026}.actions` with per-position `open_raise` / `three_bet` ranges. |\n\nRange strings use the notation parsed by the\n[GTO combos](/gto-combos.md) engine.\n\n# Examples\n\n```sh\ncargo run --example bot_selfplay        # profiles play each other\ncargo run --example exploitative_play   # uses exploit_configs\n```"}, {"id": "data/hand-histories", "type": "Dataset", "title": "Hand histories", "description": "Session YAML records in data/hands/ used for replay, debugging, and defect reports; generated/ holds runtime session output.", "tags": ["hand-history", "yaml", "replay", "sessions"], "group": "data", "sz": 28, "body": "# What lives here\n\n* `data/hands/pkarena0-session_*.yaml` \u2014 session histories captured\n  from the pkarena0-web app (a [downstream repo](/ecosystem/downstream-repos.md)),\n  including the endless-session capture `pkarena0-session_neverends.yaml`.\n* `data/hands/the_hand.yaml` \u2014 a canonical single-hand fixture.\n* `generated/bot_selfplay_*.yaml` and `generated/interactive_play_*.yaml`\n  \u2014 runtime session output (timestamped, not curated).\n\nSerialized via the `hand-histories` feature (`serde_yaml_bw`) from\n`hand_history.rs` types.\n\n# Why they matter\n\nCaptured histories are the primary *defect evidence* pipeline: the\ncritical heads-up side-pot bug was reported as a pkarena0 hand history\n(`pkarena0-hand-015`) whose YAML payouts didn't conserve chips \u2014 see\n[side-pot stratification](/pitfalls/side-pot-stratification.md). When a\ndownstream app shows wrong numbers, capture the session YAML into\n`data/hands/` and replay it."}, {"id": "data/hup-databases", "type": "Dataset", "title": "HUP equity databases", "description": "The heads-up preflop (HUP) SQLite database family, its single-table schema, and the tools that build and query it.", "tags": ["equity", "sqlite", "preflop", "hup"], "group": "data", "sz": 34, "body": "# What these are\n\nPrecomputed heads-up preflop equity results \u2014 one row per distinct\nstarting-hand matchup \u2014 persisted in SQLite and loaded through\n`analysis::store::db::hup::HUPResult` (`Sqlable` trait, `store`\nfeature). The path is read from the `HUPS_DB_PATH` environment variable\nand defaults to `generated/hups.db` \u2014 note the default points at\n`generated/` (runtime output), not `data/` (committed snapshots).\n\n# Schema\n\nAll databases in the family share one table:\n\n| Column | Type | Description |\n|---|---|---|\n| `id` | integer PK | Row id. |\n| `higher` | integer | Higher starting hand, encoded as a `Bard` bit representation. |\n| `lower` | integer | Lower starting hand, encoded as a `Bard`. |\n| `higher_wins` | integer | Boards won by the higher hand. |\n| `lower_wins` | integer | Boards won by the lower hand. |\n| `ties` | integer | Split-pot boards. |\n\nIn Rust this surfaces as `HUPResult { higher: Bard, lower: Bard, odds:\nWinLoseDraw }`.\n\n# The family in data/\n\n| File | Size | Note |\n|---|---|---|\n| `hups.db` | 1.1M | Working snapshot. |\n| `clean_hups.db` | 2.7M | Largest snapshot. |\n| `old_clean_hups.db` | 1.8M | Predecessor of clean. |\n| `last_hups.db` | 1.1M | Prior working copy. |\n| `dhups.db` | 704K | Distinct-hands variant. |\n| `sample_hups.db` | 116K | Small sample for tests/demos. |\n\n**Caveat:** which snapshot is authoritative is not recorded anywhere in\nthe repo \u2014 the names encode a manual workflow. `HUPResult::db_count` /\n`db_is_valid` exist to check a database's integrity. Treat `clean_hups.db`\nclaims with verification, not assumption.\n\n# Pipeline and tools\n\n* `examples/calc.rs` \u2014 computes matchup results.\n* `examples/insert_distinct.rs` \u2014 inserts distinct matchups.\n* `examples/hup_dump.rs` \u2014 dumps database contents.\n* `examples/export_hups_bin.rs` \u2014 exports the binary form\n  (`generated/hups.bin`, plus the zstd-compressed `bcm.zst` via\n  `generate_bcm`).\n* `data/holding/` \u2014 working files for gap-filling the matrix\n  (`gaps.txt`, `current_hups.csv`, `remaining_unique_shus.csv`,\n  `hu_nash_equilibrium`).\n\n# Citations\n\n[1] [hup.rs](https://github.com/ImperialBower/pkcore/blob/main/src/analysis/store/db/hup.rs)"}, {"id": "data/pluribus-logs", "type": "Dataset", "title": "Pluribus logs", "description": "Raw and converted hand logs from the Pluribus research poker bot, used as reference game data.", "tags": ["pluribus", "research", "hand-logs"], "group": "data", "sz": 27, "body": "# Layout\n\n* `data/pluribus/raw/` \u2014 original `sample_game_*.log` files (with a\n  README describing provenance).\n* `data/pluribus/converted_logs/` \u2014 the same games converted to\n  pkcore-consumable `pluribus_*.txt` form.\n\n# Context\n\nPluribus is the Brown/Sandholm multiplayer no-limit hold'em research\nbot; its published hand logs serve as realistic high-level play data.\nThe repository's `../docs/epics/EPIC_Pluribus.md` tracks what pkcore does with\nthem. See the raw README for provenance details before making claims\nabout the data.\n\n# Citations\n\n[1] [EPIC_Pluribus](https://github.com/ImperialBower/pkcore/blob/main/docs/epics/EPIC_Pluribus.md)"}, {"id": "ecosystem/downstream-repos", "type": "Reference", "title": "Downstream repos", "description": "Sibling repositories that consume pkcore's public API and are checked by the release audit.", "tags": ["downstream", "ecosystem", "consumers"], "group": "ecosystem", "sz": 29, "body": "# Consumers of pkcore\n\nThese sibling repositories depend on pkcore's public contract and are\nthe audit targets of the [release audit](/processes/release-audit.md):\n\n| Repo | Role |\n|---|---|\n| `pkdealer` | gRPC dealer service workspace \u2014 table authority, spectator web app, and agent clients. See [ecosystem layers](/architecture/layers.md). |\n| `pkpy` | Python bindings/consumers of pkcore. |\n| `pknotebook` | Notebook-based analysis built on pkcore. |\n| `pkgto-web` | GTO analysis web app. |\n| `pkkuhn-web` | Kuhn poker web app (EPIC-17 lineage). |\n| `pkarena0-web` | Arena web app. |\n\n# Related sibling efforts\n\n* `pkodds` \u2014 equity gRPC service (EPIC-41); pkcore publishes first,\n  pkodds depends on the released crate.\n* `pkmental` \u2014 Mental Poker spike (EPIC-79), generalizing card-game\n  concerns beyond poker.\n\n# Caveat\n\nRoles above are one-line summaries; the authoritative description of\neach repo lives in its own README and in the pkcore ROADMAP. Verify\nbefore relying on details.\n\n# Citations\n\n[1] [ROADMAP](https://github.com/ImperialBower/pkcore/blob/main/ROADMAP.md)"}, {"id": "getting-started", "type": "Guide", "title": "Getting started \u2014 pkcore Knowledge Bundle", "description": "How to navigate this bundle and where each kind of pkcore knowledge lives.", "tags": ["getting-started", "navigation"], "group": "(root)", "sz": 30, "body": "# Overview\n\nThis bundle captures curated knowledge about **pkcore**, a Rust poker\nlibrary for Texas Hold'em (and other variant) analysis, evaluation, and\ngame simulation. It is knowledge *about* the code, committed alongside\nthe code \u2014 start here, then follow links only into what you need.\n\n# Where to look\n\n| You want to understand\u2026 | Start at |\n|---|---|\n| What the crate is and its feature flags | [pkcore crate](/crate.md) |\n| A specific source module | [modules index](/modules/index.md) |\n| How the pieces layer together | [architecture layers](/architecture/layers.md) |\n| Why there are two table engines | [Table vs TableCelled](/architecture/table-vs-tablecelled.md) |\n| How work is planned and tracked | [EPIC workflow](/processes/epic-workflow.md) |\n| Testing and lint conventions | [testing conventions](/processes/testing-conventions.md) |\n| What depends on pkcore downstream | [downstream repos](/ecosystem/downstream-repos.md) |\n| The datasets in data/ and generated/ | [data index](/data/index.md) |\n| Invariants broken before (don't re-break) | [pitfalls index](/pitfalls/index.md) |\n\n# Relationship to in-repo docs\n\nThe repository's `docs/` folder holds the *primary* design record\n(EPIC-NN documents, ANALYSIS_ deep dives, DEFECT_ reports). This bundle\ndoes not duplicate them \u2014 concepts here summarize durable knowledge and\ncite those documents as sources."}, {"id": "gto-combos", "type": "concept", "title": "GTO Range Parser & Combinatorial Combos Matrix", "description": "How poker range notation strings parse into combo sets and how hero blockers prune villain combinations.", "tags": ["gto", "math", "parsing", "solvers"], "group": "(root)", "sz": 47, "body": "# GTO Range Parser & Combinatorics Engine\n\n## \ud83c\udfd7\ufe0f Architectural Paradigm\nThe GTO engine in `pkcore` translates human-readable poker range notation strings (e.g., `66+,AJs+,KQs,AJo+,KQo`) into highly optimized, bitwise-comparable combination vectors. It evaluates complex ranges against hero hands, dynamically applying card blockers to isolate pure remaining equities.\n\nHere is the strict, fully compliant Open Knowledge Format (OKF) declaration file for the GTO combo system. It maps the range parsing architecture, combinatorial math, and blocker tracking mechanics used in pkcore.\nCreate this file exactly at .okf/gto-combos.md.\n\n---type: concept\ntitle: GTO Range Parser & Combinatorial Combos Matrix\ntags: [gto, math, parsing, solvers]\nreferences: [src/prelude.rs, examples/gto.rs, pkgto-web]\n---\n# GTO Range Parser & Combinatorics Engine## \ud83c\udfd7\ufe0f Architectural ParadigmThe GTO engine in `pkcore` translates human-readable poker range notation strings (e.g., `66+,AJs+,KQs,AJo+,KQo`) into highly optimized, bitwise-comparable combination vectors. It evaluates complex ranges against hero hands, dynamically applying card blockers to isolate pure remaining equities.\n\n\n+--------------------------------+\n| Human Range String |\n| \"66+, AJs+, KQo\" |\n+--------------------------------+\n|\nv\n+--------------------------------+\n| Regex & Tokenizer Stream |\n+--------------------------------+\n/ |\nv v v\n+------------+ +------------+ +------------+\n| Pocket | | Suited | | Offsuit |\n| Pairs (+) | | Connect (+)| | Connect (+)|\n+------------+ +------------+ +------------+\n\\ | /\nv v v\n+--------------------------------+\n| Combos / Versus Solver |\n+--------------------------------+\n|\n+---------------------+---------------------+\n| |\nv v\n+-----------------------+ +-----------------------+\n| Pre-Blocker Matrix | | Post-Blocker Matrix |\n| (Raw Range Combos) | | (Hero Blockers Applied|\n+-----------------------+ +-----------------------+\n\n\n### 1. Range Syntax Tokenization Rules\nThe parser splits and resolves complex range strings based on explicit poker combinatorics archetypes:\n* **Pocket Pairs (`XX+`)**: Denotes all pairs equal to or higher than `X`. `66+` expands to `66, 77, 88, 99, TT, JJ, QQ, KK, AA`.\n* **Suited Connectors (`XYs+`)**: Denotes suited cards where rank `X` is higher than `Y`, extending up to the same kicker beneath an Ace. `AJs+` expands to `AJs, AQs`.\n* **Offsuit Connectors (`XYo+`)**: Denotes unsuited variations matching the same progressive ladder logic as suited constraints. `KQo+` expands strictly to `KQo, AKo`.\n\n---\n\n## \ud83c\udfb2 Combinatorial Generation Math\nBefore factoring in card blockers, the underlying engine populates raw combinations based on static rank probabilities:\n\n* **Pocket Pairs**: Each unblocked pair notation yields exactly **6 distinct combos** based on the 4 available suits.\n* **Suited Connectors**: Each suited notation yields exactly **4 distinct combos** (one per matching suit).\n* **Offsuit Connectors**: Each offsuit notation yields exactly **12 distinct combos** (all non-matching suit permutations).\n\n---\n\n## \ud83d\udeab Dynamic Blocker Tracking Matrix (`Versus` Struct)\nThe core `Versus` solver evaluates the intersection between Hero's isolated hand (`Two` struct) and Villain's complex `Combos` string.\n\n### 2. The Blocker Pruning Sequence\n1. **Hero Isolation**: Hero's starting cards are extracted as dead cards from the operational matrix deck.\n2. **Combinatorial Intersection**: The engine sweeps Villain's raw range table, cross-checking every sub-combo against Hero's dead cards.\n3. **Dead Card Pruning**: If a Villain card bit-matches a Hero card, that specific combo is immediately dropped.\n    * *Example*: If Hero holds `K\u2660 K\u2665`, Villain's `AKo` combo count instantly drops from **12 down to 6** options, and Villain's `KK` pocket pair drops from **6 down to 1 single remaining combo** (`K\u2666 K\u2663`).\n\n---\n\n## \u26a0\ufe0f Implementation Invariants (Do Not Break)\nWhen refactoring parsing pipelines or modifying range analysis loops inside `pkcore`, Claude must satisfy these execution constraints:\n* **Order Independence**: Range lists must parse identically regardless of spacing, casing, or sequence orientation (e.g., `AJs,66+` must yield identical mathematical objects to `66+, AJs`).\n* **Memory Safety Constraints**: Do not create dynamic infinite loops when parsing open-ended generic plus indicators (`+`). The ceiling limit must always hard-cap at `Ace` ranks natively.\n* **Wasm Compatibility**: Code blocks touching range metrics must compile natively to target targets (`wasm32-unknown-unknown`) without utilizing system-specific threading hooks to ensure zero crashes on `pkgto-web`.\n\n## \ud83c\udfc1 Next Steps\nNow that your structural .okf/ layer is defined, what would you like to do next?"}, {"id": "modules/analysis", "type": "Rust Module", "title": "Analysis", "description": "Hand evaluation, nut calculation, preflop and multi-way equity, GTO combos, outs, and player statistics.", "tags": ["evaluation", "equity", "gto", "player-stats"], "group": "modules", "sz": 31, "body": "# Overview\n\n`analysis` is the crate's brain \u2014 everything that scores, compares, or\nreasons about hands lives here.\n\n# Hand evaluation\n\n* `analysis::evals::Evals` \u2014 complete evaluation results: 5-card\n  rankings via Cactus Kev's evaluator, 7-card Texas Hold'em analysis,\n  8-or-better low qualification, and hand classifications (pair through\n  straight flush).\n* `analysis::the_nuts::TheNuts` \u2014 strongest possible hand given\n  community cards, for both high and low analysis.\n* Supporting types: `outs`, `pot_odds`, `ev`, `hand_rank`, `class`,\n  and Omaha-specific evaluation in `omaha`.\n\n# Equity\n\n* `analysis::store::db::hup::HUPResult` \u2014 precomputed heads-up preflop\n  matchups persisted in SQLite (path configurable via `HUPS_DB_PATH`),\n  with split-pot support and bulk insertion. See\n  [HUP equity databases](/data/hup-databases.md).\n* `analysis::equity` (behind the `equity` feature) \u2014 pure-compute\n  multi-way equity engine: exact enumeration plus seeded Monte Carlo,\n  parallelized with rayon.\n\n# GTO and ranges\n\n* `analysis::gto` \u2014 `Combo`, `ComboPairs`, and `Twos` for range\n  explosion and combo-weighted equity breakdowns; `range_equity`\n  computes equities over ranges. See `examples/gto.rs` and\n  [GTO combos](/gto-combos.md).\n\n# Player statistics\n\n`player_stats` and `player_stats_store` (features `player-stats` /\n`player-stats-persistence`) aggregate per-player behavior over sessions\n\u2014 consumed by the exploitative decider in the\n[bot module](/modules/bot.md).\n\n# Citations\n\n[1] [Cactus Kev's Poker Hand Evaluator](https://suffe.cool/poker/evaluator.html)"}, {"id": "modules/bot", "type": "Rust Module", "title": "Bot", "description": "Serializable BotProfile personalities, decision-making deciders, and self-play simulation.", "tags": ["bots", "ai", "profiles", "self-play"], "group": "modules", "sz": 31, "body": "# Overview\n\n`bot` packages poker-playing personalities as data. It was consolidated\ninto pkcore rather than shipped as the originally planned standalone\n`pkbot` crate.\n\n# Key concepts\n\n* `BotProfile` \u2014 a fully serializable personality combining a GTO range\n  strategy with a betting strategy: preflop range charts, postflop\n  tendencies, aggression factors, and bluff frequencies. Profiles are\n  YAML files in `data/bots/`, organized per variant (nlhe, flhe, plo,\n  stud_hi, razz), loaded via `serde_yaml_bw` behind the `bot-profiles`\n  feature. See [bot profiles](/data/bot-profiles.md) for the schema.\n* Deciders \u2014 `RuleBasedDecider`, `JokerDecider`, and\n  `ExploitativeDecider` consume profiles to choose actions. The\n  exploitative decider additionally reads opponent tendencies from the\n  player-stats aggregator in the [analysis module](/modules/analysis.md).\n* Self-play \u2014 a table of profile-driven bots can play autonomously\n  (EPIC-19, closed), which is the local counterpart to the gRPC agents\n  in [downstream repos](/ecosystem/downstream-repos.md). Decision\n  branches must stay probabilistic \u2014 see\n  [bot raise escalation](/pitfalls/bot-raise-escalation.md).\n\n# Why profiles are data\n\nDifferent YAML profiles produce different archetypes (tight-passive,\nloose-aggressive, GTO-driven) without code changes \u2014 the same property\nthat lets downstream services and the WASM web app load personalities\nat runtime."}, {"id": "modules/cards", "type": "Rust Module", "title": "Cards and decks", "description": "Card, Cards, Deck, Rank, and Suit primitives with u32 bit representations and the Pile trait.", "tags": ["cards", "primitives", "bit-representation"], "group": "modules", "sz": 30, "body": "# Overview\n\nThe card primitives are the foundation every other layer builds on:\n\n* `card::Card` \u2014 a single playing card, a `u32` newtype using Cactus\n  Kev\u2013style bit packing for efficient bitwise operations. Parses from\n  strings like `\"As\"`, `\"a\u2660\"`, or `\"2h\"`. See\n  [Cactus Kev lookup core](/cactus-kev-lookup.md).\n* `cards::Cards` \u2014 an ordered, deduplicated collection (hands, boards)\n  built on `IndexSet` for O(1) lookups with insertion order preserved.\n* `deck::Deck` \u2014 a shuffleable 52-card deck supporting draws and\n  remaining-inventory checks.\n* `rank::Rank` / `suit::Suit` \u2014 card components. `Suit` carries shift\n  operations used by suit-shift \"distinct hand\" pattern analysis.\n\n# Key trait\n\n`Pile` provides the common operations for card collections: containment\nchecks, combination generation and enumeration, rank/suit extraction,\nuniqueness validation, and delegation into hand evaluation (see the\n[analysis module](/modules/analysis.md)).\n\n# Related\n\nThe `lookups` module vendors Cactus Kev\u2013style evaluation tables\n(via Vladislav Supalov's `pokereval-rs`) that the evaluators consume.\n\n# Citations\n\n[1] [Cactus Kev's Poker Hand Evaluator](https://suffe.cool/poker/evaluator.html)\n[2] [pokereval-rs](https://github.com/vsupalov/pokereval-rs)"}, {"id": "modules/casino", "type": "Rust Module", "title": "Casino", "description": "Game orchestration \u2014 the Table and TableCelled engines, Dealer, Cashier, and PokerSession.", "tags": ["table", "dealer", "session", "game-loop"], "group": "modules", "sz": 30, "body": "# Overview\n\n`casino` orchestrates actual play: seating, dealing, betting rounds,\npot management, and payouts.\n\n# Key types\n\n* `casino::table::Table` \u2014 the primary table engine with plain value\n  semantics. Supports deck injection for deterministic tests, exposes\n  `is_betting_complete()`, and builds finished hands via `build_game()`.\n* `casino::table_celled::TableCelled` \u2014 the earlier interior-mutability\n  engine. See [Table vs TableCelled](/architecture/table-vs-tablecelled.md)\n  for why both exist and which to choose.\n* `Dealer` \u2014 drives street progression and dealing.\n* `Cashier` \u2014 chip accounting, pots, side pots, and `winnings` payouts.\n* `PokerSession` \u2014 multi-hand session state; `PokerSession::view()`\n  produces `SessionView` / `SeatView` read-model snapshots (re-exported\n  in the prelude) for spectator and transport layers.\n* Supporting types: `position` (seat positions), `player`, `action`,\n  `state`, `manager`, `principal`, and per-seat `equity`.\n\n# Design note\n\nBetting semantics in `Table` are non-obvious \u2014 blinds, short-stack\ncall targets, and heads-up side pots have all had dedicated defect\nwrite-ups; see the [pitfalls group](/pitfalls/index.md) for the\ndistilled invariants before changing betting-completion logic.\n\n# Citations\n\n[1] [ANALYSIS_TableCelled_vs_Table](https://github.com/ImperialBower/pkcore/blob/main/docs/ANALYSIS_TableCelled_vs_Table.md)"}, {"id": "modules/games", "type": "Rust Module", "title": "Games", "description": "Variant definitions \u2014 GameType, BettingStructure, GameFamily, streets, and game phases.", "tags": ["variants", "holdem", "omaha", "stud", "razz"], "group": "modules", "sz": 29, "body": "# Overview\n\n`games` defines *what game is being played*, independent of the table\nmechanics in the [casino module](/modules/casino.md):\n\n* `GameType` \u2014 which variant (NLHE, Limit Hold'em, PLO, Stud Hi,\n  Razz). `GameType` and `GamePhase` implement `Serialize`/`Deserialize`\n  so transport layers can carry them.\n* `BettingStructure` \u2014 no-limit, pot-limit, fixed-limit.\n* `GameFamily` \u2014 groups variants sharing dealing structure\n  (board games vs stud games).\n* Street/phase progression per variant.\n\n# Variant status\n\nThe variant engine was built out under EPIC-29 (foundation) with Limit\nHold'em (EPIC-30), Pot-Limit Omaha (EPIC-31), and Razz (EPIC-33)\ncompleted; Stud Hi (EPIC-32) and web variant selection (EPIC-34) are\ntracked in `docs/`. See [EPIC workflow](/processes/epic-workflow.md)\nfor how those documents are organized. PLO's evaluation rule is\ncaptured in [PLO rules](/plo-rules.md).\n\n# Related\n\nThe `play` module hosts interactive-play flows built on these\ndefinitions, and bot profile YAML in `data/bots/` is organized per\nvariant \u2014 see the [bot module](/modules/bot.md) and\n[bot profiles](/data/bot-profiles.md)."}, {"id": "pitfalls/betting-completion-flake", "type": "Pitfall", "title": "Betting-completion flake (OPEN)", "description": "Rare non-deterministic ActionIsntFinished panic in 1,000-hand self-play runs \u2014 diagnosis incomplete, unseeded RNG makes it hard to reproduce.", "tags": ["flake", "betting", "open-defect", "testing"], "group": "pitfalls", "sz": 30, "body": "# Status: OPEN\n\nDiagnosis incomplete as of the defect report (2026-05-12, surfaced\nduring EPIC-29 verification). If you hit this, you are not the first.\n\n# Symptom\n\n`tests/exploitative_play_smoke.rs::exploit_wrapper_no_stats_conserves_chips`\nintermittently panics with `PKError::ActionIsntFinished`, returned by\n`bring_it_in` / `close_it_out` when `is_betting_complete()` is `false`\nat the moment the engine advances streets. The test runs 1,000 random\nheads-up hands via `SimTable::run_n_hands` with **unseeded**\n`thread_rng()` \u2014 observed at ~1/30 full-suite runs post-EPIC-29\n(statistically indistinguishable from the 0/30 baseline).\n\n# What this means for you\n\n* A single red run of this test is not evidence your change is broken \u2014\n  but do not suppress or delete the test; it guards chip conservation.\n* Any diagnosis should start by seeding the RNG to make failures\n  reproducible; the report notes EPIC-29 consumed no additional RNG\n  calls, so the trigger predates it or is state-dependent.\n* The suspect surface is `is_betting_complete()` \u2014 the same\n  betting-completion contract flagged as non-obvious in the\n  [casino module](/modules/casino.md).\n\n# Citations\n\n[1] [DEFECT_004_exploit_smoke_flake](https://github.com/ImperialBower/pkcore/blob/main/docs/defects/DEFECT_004_exploit_smoke_flake.md)"}, {"id": "pitfalls/bot-raise-escalation", "type": "Pitfall", "title": "Bot raise escalation", "description": "Deterministic equity-threshold raise gates make two strong-handed bots re-raise each other to all-in every hand \u2014 raise decisions need a probabilistic gate.", "tags": ["bots", "deciders", "simulation"], "group": "pitfalls", "sz": 29, "body": "# Invariant\n\nA bot's raise decision must not be a deterministic function of a\nstatic equity estimate. If `equity > threshold` unconditionally raises,\ntwo bots holding in-range hands re-raise forever: each raise nudges pot\nodds but never flips the condition while the equity proxy stays\nconstant (the preflop proxy is binary \u2014 1.0 if in the profile's\n`open_raise` range).\n\n# How it was broken\n\n`RuleBasedDecider::decide_with_rng`'s strong-hand branch\n(`equity > pot_odds * 2.0`) fired deterministically. The marathon\nsimulation (`bot_marathon__1000_hands_without_error` \u2014 1,000 hands, no\nbot may bust) failed after 509 hands from raise-ladder chip\nconcentration. Fixed with a probabilistic raise gate plus regression\ntests.\n\n# When touching deciders\n\nAny new decision branch in the [bot module](/modules/bot.md) should be\nexercised against the marathon test before merging \u2014 escalation bugs\nonly show up over hundreds of hands, not in single-hand unit tests.\nProfile data lives in [bot profiles](/data/bot-profiles.md).\n\n# Citations\n\n[1] [DEFECT_002_bot_escalation](https://github.com/ImperialBower/pkcore/blob/main/docs/defects/DEFECT_002_bot_escalation.md)"}, {"id": "pitfalls/short-blind-call-target", "type": "Pitfall", "title": "Short-blind call target", "description": "When the BB posts all-in short, the call target stays at the configured BB (TDA Rule 41) \u2014 do not lower it to the posted amount.", "tags": ["betting", "blinds", "tda-rules"], "group": "pitfalls", "sz": 31, "body": "# Invariant\n\nIf the big blind can only post part of the configured blind (all-in for\n60 of 100), the amount-to-match for the round **remains the configured\nBB**. Other players call the full 100 or fold/raise. Chip conservation\nis preserved downstream by [side-pot stratification](/pitfalls/side-pot-stratification.md)\n\u2014 the short BB's cap limits what they can *win*, not what others must\n*commit*. This is TDA Rule 41 / Robert's Rules, standard everywhere.\n\n# Why this one is dangerous\n\nThe wrong interpretation was once shipped **on purpose**: 0.0.48 set\n`self.bet` to the actual posted amount, documented it as a fix, and\nflipped four tests to encode the wrong behavior. It survived until\n0.0.55. `self.bet` is the authoritative call target read by\n`to_call()`, `act_call()`, *and* `act_raise()` increment validation \u2014\nso the bug also silently accepted illegal under-the-BB raises.\n\nThe lesson: a plausible-sounding rule rationale plus passing tests is\nnot proof of correctness. If a change touches blind posting or call\ntargets, check it against the cited cardroom rules first.\n\n# Related\n\n`../docs/epics/EPIC-DEFECT-Minraise.md` (title-only stub) flags that the\nlast-raise-size rule was not enforced by `TableCelled` \u2014 min-raise\nenforcement has history in both engines.\n\n# Citations\n\n[1] [DEFECT_001_BUGFIX_short_blind_call_target](https://github.com/ImperialBower/pkcore/blob/main/docs/defects/DEFECT_001_BUGFIX_short_blind_call_target.md)\n[2] [DEFECT_001_shortstack_bb_call_amount](https://github.com/ImperialBower/pkcore/blob/main/docs/defects/DEFECT_001_shortstack_bb_call_amount.md) \u2014 preserved record of the rejected interpretation"}, {"id": "pitfalls/showdown-invariants", "type": "Pitfall", "title": "Showdown invariants", "description": "Three invariants broken in the April 2026 RCA \u2014 full pot distribution, chip conservation, and seat number == array index \u2014 all in the under-tested showdown path.", "tags": ["showdown", "chip-conservation", "rca"], "group": "pitfalls", "sz": 31, "body": "# The invariants\n\nThe April 2026 root-cause analysis (versions 0.0.41\u20130.0.45, downstream\nimpact on pkdealer and pkarena0-web) documented three defects, each\nbreaking a fundamental engine invariant:\n\n| Defect | Invariant broken | Root cause |\n|---|---|---|\n| A \u2014 seat 8 winner not detected | Pot must be fully distributed | `winning_seats()` iterated `0..u8::BITS` over a win bitmask where seat 8 occupies bit 8 \u2014 an off-by-one width assumption in `case_eval.rs`. |\n| B \u2014 chip leak | Chip conservation across a hand | Showdown accounting in `Table` / `table_equity.rs`. |\n| C \u2014 seat misindexing | Seat number == array index | `hand_history.rs` + table code disagreed on seat indexing. |\n\n# The structural lesson\n\nAll three lived in the **showdown path** \u2014 code that only fires after\nall streets complete, which street-level unit tests never reach. Tests\ncovering preflop/flop action gave false confidence. When changing\nanything in showdown, run full-hand and session-level tests\n(self-play marathon, session replay) \u2014 see also the open\n[betting-completion flake](/pitfalls/betting-completion-flake.md) and\n[side-pot stratification](/pitfalls/side-pot-stratification.md), which\nis the same lesson repeated.\n\n`CaseEval` is a `Vec\u003cEval>` indexed by seat number, with\n`Eval::default()` filling folded/empty seats \u2014 any code that filters or\nreorders it breaks invariant C.\n\n# Citations\n\n[1] [RCA_Table_Mechanic_2026](https://github.com/ImperialBower/pkcore/blob/main/docs/RCA_Table_Mechanic_2026.md)"}, {"id": "pitfalls/side-pot-stratification", "type": "Pitfall", "title": "Side-pot stratification", "description": "Showdown must partition the pot into commitment-capped layers; splitting the aggregate pot silently misdistributes chips.", "tags": ["showdown", "side-pots", "chip-conservation"], "group": "pitfalls", "sz": 30, "body": "# Invariant\n\nWhen chip commitments differ at showdown (all-ins, unequal folded\ncontributions), the pot must be partitioned into layers, each capped at\na contributor's commitment level:\n\n* A player all-in for X is eligible only for the layer(s) up to X.\n* Chips one player committed beyond what anyone matched are\n  **uncalled** and return to the bettor \u2014 they were never in play.\n* Tied winners split **each layer they are jointly eligible for**,\n  never the aggregate pot.\n\n# How it was broken\n\nThe heads-up showdown path (both `Table` and the `table/showdown.rs`\npath) collapsed the entire pot into one bucket and split it evenly \u2014\nlatent since each path was first written (April 2026). In the reporting\nhand, two tied winners each got ~half of 42,445 instead of the correct\n7,460 / 34,985 split; the shorter stack was overpaid and showed a\npositive net on chips it could never win. Fixed 2026-04-27.\n\n# Tell-tale symptom\n\nA hand history where a *winning* seat has negative `net`, or `pot_won`\nvalues that are exactly `total_pot / n_winners` despite unequal\ncommitments. Evidence arrives as session YAML \u2014 see\n[hand histories](/data/hand-histories.md).\n\n# Citations\n\n[1] [DEFECT_003_heads_up_side_pot](https://github.com/ImperialBower/pkcore/blob/main/docs/defects/DEFECT_003_heads_up_side_pot.md)"}, {"id": "plo-rules", "type": "structural", "title": "Pot-Limit Omaha (PLO) Rules Framework", "description": "PLO's exactly-2-hole / exactly-3-board evaluation rule, the 60-combination loop, and its zero-allocation constraints.", "tags": ["omaha", "rules", "allocation-safety"], "group": "(root)", "sz": 28, "body": "# Pot-Limit Omaha Engine Specifications\n\n## \ud83d\udcd0 The Hand Validation Constraint\nUnlike Texas Hold'em, where a player can utilize any combination of board and hole cards, PLO enforces a strict mathematical rule:\n* **Hole Cards**: Must use **exactly 2** cards from the player's private hand.\n* **Board Cards**: Must use **exactly 3** cards from the community board layout.\n\n### Combinatorial Loop Footprint\nEvaluating a single PLO hand requires checking exactly **60 distinct combinations** (`6` hole configurations $\\times$ `10` board configurations).\n\n---\n\n## \ud83d\udeab Allocation Restrictions (Strict Invariant)\n* **No Heap Allocations**: Do not use `Vec`, `alloc::vec!`, or variable collectors inside the evaluation loops.\n* **Stack Bounds**: Use explicit, hardcoded primitive `for` loop offsets to minimize instructions and maximize the cache lines of embedded data arrays."}, {"id": "processes/epic-workflow", "type": "Process", "title": "EPIC workflow", "description": "Feature work is designed in numbered EPIC documents under docs/, with companion forms for defects, analyses, and tutorials.", "tags": ["planning", "epics", "documentation"], "group": "processes", "sz": 30, "body": "# The convention\n\nAll substantial work starts as a numbered design document in `docs/`:\n\n* `EPIC-NN_\u003cName>.md` \u2014 the house-style spec: Context, a Status table,\n  Design sketches, phased Work Items, and a Verification block.\n* Finished epics get a `-CLOSED` suffix appended to the filename.\n* Companion forms share the folder: `DEFECT_\u003cslug>.md` (diagnosed\n  bugs), `ANALYSIS_\u003ctopic>.md` (deep dives), `TUTORIAL_*.md`,\n  `RCA_*.md` (root-cause analyses), and `SIDEQUEST` docs.\n\n# Supporting files\n\n| File | Role |\n|---|---|\n| `ROADMAP.md` | Long-term vision across the whole ecosystem \u2014 read first for any service/agent/observability work. |\n| `BACKLOG.md` | Current inventory of outstanding work. |\n| `docs/TECHNICAL_DEBT.md` | Tracked debt items. |\n| `CHANGELOG.md` | Release history. |\n| `DIARY.md` | Running development diary. |\n\n# Why it matters for agents\n\nThe EPIC corpus is the project's institutional memory \u2014 status tables\nsay what is actually done (not what was planned), and defect reports\ncapture betting-logic subtleties that are easy to re-break (distilled\nin the [pitfalls group](/pitfalls/index.md)). Cite them rather than\nre-deriving. Related: [testing conventions](/processes/testing-conventions.md)."}, {"id": "processes/release-audit", "type": "Playbook", "title": "Release audit", "description": "After releasing pkcore, audit downstream repos for breakage from renamed types, removed APIs, or new error variants.", "tags": ["release", "audit", "downstream"], "group": "processes", "sz": 27, "body": "# Trigger\n\nRun after any pkcore release that changes the public contract \u2014\nrenames, removals, new error variants, or prelude changes.\n\n# Steps\n\n1. Enumerate the consumers in [downstream repos](/ecosystem/downstream-repos.md).\n2. For each, check compilation and usage of the changed surface\n   (renamed types, removed APIs, new error variants).\n3. Record findings in `docs/RELEASE_AUDIT_\u003cversion>.md` in the pkcore\n   repo.\n4. File follow-up work per affected repo; large migrations get their\n   own doc (see `docs/DOWNSTREAM_MIGRATION_0.2.0.md` as the precedent).\n\n# Notes\n\nRelease notes themselves are generated separately into\n`docs/releases/` by diffing the previous version tag against HEAD. The\n[EPIC workflow](/processes/epic-workflow.md) covers how larger\nmigration efforts are specced."}, {"id": "processes/testing-conventions", "type": "Process", "title": "Testing conventions", "description": "Colocated unit tests, mandatory doc tests, double-underscore test module names, and pedantic clippy gates.", "tags": ["testing", "clippy", "conventions"], "group": "processes", "sz": 29, "body": "# Placement and naming\n\n* Tests are **colocated**: `#[cfg(test)]` modules in the same file as\n  the code, preferred over separate `tests/` integration files.\n* Test modules are named after the module path with double underscores,\n  e.g. `casino__table__position_tests`.\n* Test functions do **not** carry a `test_` prefix \u2014 the scenario name\n  stands alone (e.g. `is_betting_complete_heads_up`).\n\n# Coverage expectations\n\n* Every public function has at least one unit test and at least one\n  doc test (`# Examples` block) that compiles and runs.\n* Error cases and boundary conditions get explicit tests; `# Errors`\n  and `# Panics` sections document them.\n\n# Gates\n\n* `clippy::pedantic`, `clippy::unwrap_used`, `clippy::expect_used`\n  warn at the crate root \u2014 no `unwrap()`/`expect()`/`panic!()` in\n  library code (tests may).\n* `cargo-mutants` (`mutants.toml`) and `cargo-deny` (`deny.toml`) are\n  configured; the `Makefile` bundles the common invocations.\n\n# Citations\n\n[1] [RUST_STYLE_GUIDE](https://github.com/ImperialBower/pkcore/blob/main/docs/RUST_STYLE_GUIDE.md)\n[2] [CLAUDE.md](https://github.com/ImperialBower/pkcore/blob/main/CLAUDE.md)"}], EDGES=[{"source": "architecture/layers", "target": "crate"}, {"source": "architecture/layers", "target": "modules/bot"}, {"source": "architecture/layers", "target": "ecosystem/downstream-repos"}, {"source": "architecture/table-vs-tablecelled", "target": "modules/casino"}, {"source": "crate", "target": "modules/cards"}, {"source": "crate", "target": "modules/analysis"}, {"source": "crate", "target": "modules/casino"}, {"source": "crate", "target": "modules/games"}, {"source": "crate", "target": "modules/bot"}, {"source": "crate", "target": "ecosystem/downstream-repos"}, {"source": "crate", "target": "processes/testing-conventions"}, {"source": "data/bot-profiles", "target": "modules/bot"}, {"source": "data/bot-profiles", "target": "gto-combos"}, {"source": "data/hand-histories", "target": "ecosystem/downstream-repos"}, {"source": "data/hand-histories", "target": "pitfalls/side-pot-stratification"}, {"source": "ecosystem/downstream-repos", "target": "processes/release-audit"}, {"source": "ecosystem/downstream-repos", "target": "architecture/layers"}, {"source": "getting-started", "target": "crate"}, {"source": "getting-started", "target": "architecture/layers"}, {"source": "getting-started", "target": "architecture/table-vs-tablecelled"}, {"source": "getting-started", "target": "processes/epic-workflow"}, {"source": "getting-started", "target": "processes/testing-conventions"}, {"source": "getting-started", "target": "ecosystem/downstream-repos"}, {"source": "modules/analysis", "target": "data/hup-databases"}, {"source": "modules/analysis", "target": "gto-combos"}, {"source": "modules/analysis", "target": "modules/bot"}, {"source": "modules/bot", "target": "data/bot-profiles"}, {"source": "modules/bot", "target": "modules/analysis"}, {"source": "modules/bot", "target": "ecosystem/downstream-repos"}, {"source": "modules/bot", "target": "pitfalls/bot-raise-escalation"}, {"source": "modules/cards", "target": "cactus-kev-lookup"}, {"source": "modules/cards", "target": "modules/analysis"}, {"source": "modules/casino", "target": "architecture/table-vs-tablecelled"}, {"source": "modules/games", "target": "modules/casino"}, {"source": "modules/games", "target": "processes/epic-workflow"}, {"source": "modules/games", "target": "plo-rules"}, {"source": "modules/games", "target": "modules/bot"}, {"source": "modules/games", "target": "data/bot-profiles"}, {"source": "pitfalls/betting-completion-flake", "target": "modules/casino"}, {"source": "pitfalls/bot-raise-escalation", "target": "modules/bot"}, {"source": "pitfalls/bot-raise-escalation", "target": "data/bot-profiles"}, {"source": "pitfalls/short-blind-call-target", "target": "pitfalls/side-pot-stratification"}, {"source": "pitfalls/showdown-invariants", "target": "pitfalls/betting-completion-flake"}, {"source": "pitfalls/showdown-invariants", "target": "pitfalls/side-pot-stratification"}, {"source": "pitfalls/side-pot-stratification", "target": "data/hand-histories"}, {"source": "processes/epic-workflow", "target": "processes/testing-conventions"}, {"source": "processes/release-audit", "target": "ecosystem/downstream-repos"}, {"source": "processes/release-audit", "target": "processes/epic-workflow"}];
const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],
 style:[
  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,
   'text-outline-width':2,'text-outline-color':'#0e0f13','min-zoomed-font-size':6,
   'width':'data(sz)','height':'data(sz)'}},
  {selector:'edge',style:{'width':1.2,'line-color':'#3a4150','target-arrow-color':'#3a4150',
   'target-arrow-shape':'triangle','arrow-scale':.8,'curve-style':'bezier','opacity':.7}},
  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:90,padding:40}});
const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?DOMPurify.sanitize(marked.parse(n.body)):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.batch(()=>cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');}));}
let debounce;
document.getElementById('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(applyFilter,150);};
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
let curLayout='cose';
document.getElementById('layout').onchange=e=>{const v=e.target.value;
 if(v==='cose'&&NODES.length>1000&&!confirm(`force layout on ${NODES.length} concepts can freeze this tab — run anyway?`)){e.target.value=curLayout;return;}
 curLayout=v;cy.layout({name:v,animate:true,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
document.getElementById('layout').value='cose';
const Q=new URLSearchParams(location.search),QL=Q.get('layout'),QS=Q.get('select');
if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;curLayout=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
function fromHash(){try{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId[h])select(h);}catch(e){}}
addEventListener('hashchange',fromHash);
if(QS&&byId[QS])select(QS);else fromHash();
</script></body></html>
